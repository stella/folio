name: Playwright browsers
description: >-
  Installs Playwright browsers, and on Linux the system packages they need,
  from caches keyed by runner and Playwright version. A cold fetch is saved
  as soon as it lands, so a job that later fails or times out still leaves
  the next run warm.

inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: false
    default: chromium

runs:
  using: composite
  steps:
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    - name: Name the browser caches
      id: names
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        browsers=$(printf '%s\n' $BROWSERS | sort | paste -sd- -)
        echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS_NAME" = "macOS" ]; then
          echo "path=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT"
        else
          echo "path=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore Playwright browsers
      id: browser-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.names.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.names.outputs.browsers }}-${{ steps.playwright.outputs.version }}

    - name: Restore Playwright system packages
      id: apt-cache
      if: runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-apt
        key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-playwright-apt-${{ steps.names.outputs.browsers }}-${{ steps.playwright.outputs.version }}

    - name: Prepare Playwright system packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Package sources the browser packages do not need, and whose mirrors
        # have stalled installs.
        for source in azure-cli.list azure-cli.sources microsoft-prod.list microsoft-prod.sources; do
          sudo rm -f "/etc/apt/sources.list.d/$source"
        done
        archives="$HOME/.cache/playwright-apt"
        mkdir -p "$archives/partial"
        # apt installs from the cached packages and keeps what it downloads
        # beside them for the cache to save. A retry waits for the lock a
        # stopped attempt held instead of failing on it.
        printf 'Dir::Cache::Archives "%s";\nDPkg::Lock::Timeout "60";\n' "$archives" |
          sudo tee /etc/apt/apt.conf.d/99playwright-archives >/dev/null

    # The only step that downloads browsers. A cold install finishes in a few
    # minutes, so an attempt that runs past ATTEMPT_SECONDS is stalled: it is
    # stopped and the download is tried once more. A second failure fails the
    # step instead of holding the job until its own limit.
    - name: Install Playwright browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        RUNNER_OS_NAME: ${{ runner.os }}
        ATTEMPT_SECONDS: "480"
      run: |
        flags=()
        if [ "$RUNNER_OS_NAME" = "Linux" ]; then
          flags=(--with-deps)
        fi

        # Each attempt runs in its own process group, so the limit also stops
        # the download and package processes the install started.
        attempt() {
          set -m
          # shellcheck disable=SC2086 # one browser name per word
          bunx playwright install "${flags[@]}" $BROWSERS &
          local install=$!
          set +m
          (
            trap 'kill "$timer" 2>/dev/null || true; exit 0' TERM
            sleep "$ATTEMPT_SECONDS" &
            timer=$!
            wait "$timer"
            echo "::warning::Playwright install ran past ${ATTEMPT_SECONDS}s; stopping it"
            kill -TERM -- "-$install" 2>/dev/null || true
            sleep 10 &
            timer=$!
            wait "$timer"
            kill -KILL -- "-$install" 2>/dev/null || true
          ) &
          local watchdog=$!
          local status=0
          wait "$install" || status=$?
          kill "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          return "$status"
        }

        if ! attempt; then
          echo "::warning::Playwright install failed; trying the download once more"
          attempt
        fi
        if [ "$RUNNER_OS_NAME" = "Linux" ]; then
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/playwright-apt"
        fi

    - name: Save Playwright browsers
      if: steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.names.outputs.path }}
        key: ${{ steps.browser-cache.outputs.cache-primary-key }}

    - name: Save Playwright system packages
      if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-apt
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
