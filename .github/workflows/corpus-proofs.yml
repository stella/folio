name: Corpus proofs

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Census the full invariant set or only editor round-trip
        type: choice
        options: [all, editor-round-trip]
        default: all
        required: false

permissions: {}

jobs:
  diag:
    name: Diagnose operation locality on five corpus files
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Point the corpus cache outside the checkout
        run: echo "FOLIO_CORPUS_CACHE=$RUNNER_TEMP/folio-corpus" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: stella/.github/actions/setup-bun-cached@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
        with:
          bun-version-file: "package.json"
      - run: bun install --frozen-lockfile
      - run: bun run corpus:fetch
      - name: Diagnose
        env:
          IDS: clippit/TestFiles/RP/RP009-Deleted-Table-Row.docx clippit/TestFiles/RP/RP037-Changed-Style-Para-Props.docx open-xml-sdk/test/DocumentFormat.OpenXml.Tests.Assets/assets/TestDataStorage/O15Conformance/WD/CommentExTest/Comments-Sample-15-12-01/Comment018.docx apache-poi/test-data/document/Tika-792.docx
        run: |
          set +e
          for variant in fix main; do
            if [ "$variant" = main ]; then git checkout -q origin/main -- packages/docx-core/src/ops/revisionInfo.ts; fi
            for id in $IDS; do
              out="$RUNNER_TEMP/diag-$variant-$(basename "$id").txt"
              DIAG_OUT="$out" timeout 900 bun scripts/corpus-gate.ts run --tiers 1 --only "$id" --concurrency 1 --invariant-budget 300000 --file-budget 900000 --timeout 900000 --out "$RUNNER_TEMP/c.json" > "$RUNNER_TEMP/run.log" 2>&1
              echo "==== $variant $id"
              grep -o 'op-[a-z]*[^"]*' "$RUNNER_TEMP/c.json" | sort | uniq -c | cut -c1-300 | head -30
              grep -E 'model=\[".+|serialized=\[".+|SAVE-ERROR|compound=\[".+' "$out" | cut -c1-900 | head -40
              echo "lines $(grep -c . "$out")"
            done
          done
