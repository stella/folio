name: Corpus proofs

on:
  workflow_dispatch:
    inputs:
      scope:
        description: unused on this scratch branch
        required: false

permissions: {}

jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: delete-blocks
            ids: apache-poi/test-data/document/rtl.docx,apache-poi/test-data/document/61745.docx
          - name: main-part
            ids: docx-templates/src/__tests__/fixtures/office365.docx,docx2python/tests/resources/renamed_document_xml.docx
    steps:
      - name: Point the corpus cache outside the checkout
        run: echo "FOLIO_CORPUS_CACHE=$RUNNER_TEMP/folio-corpus" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stella/.github/actions/setup-bun-cached@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
        with:
          bun-version-file: "package.json"
      - name: Check
        env:
          IDS: ${{ matrix.ids }}
        run: |
          set +e
          bun install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || { echo "CHECK install failed"; tail -20 "$RUNNER_TEMP/install.log"; }
          bun run corpus:fetch > "$RUNNER_TEMP/fetch.log" 2>&1 || { echo "CHECK fetch failed"; tail -20 "$RUNNER_TEMP/fetch.log"; }
          timeout 2400 bun scripts/corpus-gate.ts run --tiers 1 --only "$IDS" --concurrency 2 --invariant-budget 120000 --file-budget 600000 --timeout 2400000 --out "$RUNNER_TEMP/c.json" > "$RUNNER_TEMP/run.log" 2>&1
          echo "CHECK exit $?"
          tail -30 "$RUNNER_TEMP/run.log"
          if [ -s "$RUNNER_TEMP/c.json" ]; then
            grep -o '"[^"]*op-\(locality\|inverse\)[^"]*"' "$RUNNER_TEMP/c.json" | sort | uniq -c | sed 's/^/CHECK_SIG /'
            grep -o '"op-\(locality\|inverse\)[^"]*"' "$RUNNER_TEMP/c.json" | wc -l | sed 's/^/CHECK_COUNT /'
            echo "CHECK_JSON_BEGIN"; head -c 20000 "$RUNNER_TEMP/c.json"; echo; echo "CHECK_JSON_END"
          else
            echo "CHECK no census"
          fi
