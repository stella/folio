name: Corpus proofs

on:
  workflow_dispatch:
    inputs:
      scope:
        description: unused on this scratch branch
        required: false

permissions: {}

jobs:
  bisect:
    name: Bisect ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deleteBlocks-untouched-paragraph
            ids: apache-poi/test-data/document/rtl.docx,apache-poi/test-data/document/61745.docx
            pattern: deleteBlocks changed an untouched paragraph
          - name: unrelated-document-part
            ids: docx-templates/src/__tests__/fixtures/office365.docx,docx2python/tests/resources/renamed_document_xml.docx
            pattern: "insertText changed unrelated serialized part: word/document.xml"
          - name: styles-part
            ids: clippit/TestFiles/RP/RP037-Changed-Style-Para-Props.docx
            pattern: "insertText changed unrelated serialized part: word/styles.xml"
          - name: unbalanced-comment-range
            ids: open-xml-sdk/test/DocumentFormat.OpenXml.Tests.Assets/assets/TestDataStorage/O15Conformance/WD/CommentExTest/Comments-Sample-15-12-01/Comment018.docx
            pattern: Unbalanced comment range
          - name: unbalanced-move-range
            ids: apache-poi/test-data/document/Tika-792.docx
            pattern: Unbalanced move-to range
          - name: comment-not-present
            ids: docxtemplater/examples/expected-tag-with-comment.docx
            pattern: is referenced but not present
    steps:
      - name: Point the corpus cache outside the checkout
        run: echo "FOLIO_CORPUS_CACHE=$RUNNER_TEMP/folio-corpus" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: stella/.github/actions/setup-bun-cached@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
        with:
          bun-version-file: "package.json"
      - name: Bisect
        env:
          IDS: ${{ matrix.ids }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          set +e
          cat > "$RUNNER_TEMP/probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE"
          sha=$(git rev-parse --short=9 HEAD)
          bun install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1 || bun install > "$RUNNER_TEMP/install.log" 2>&1 || { echo "BISECT $sha SKIP install"; exit 125; }
          bun run corpus:fetch > "$RUNNER_TEMP/fetch.log" 2>&1 || { echo "BISECT $sha SKIP fetch"; tail -5 "$RUNNER_TEMP/fetch.log"; exit 125; }
          rm -f "$RUNNER_TEMP/c.json"
          start=$(date +%s)
          timeout 1500 bun scripts/corpus-gate.ts run --tiers 1 --only "$IDS" --concurrency 2 --invariant-budget 120000 --file-budget 600000 --timeout 900000 --out "$RUNNER_TEMP/c.json" > "$RUNNER_TEMP/run.log" 2>&1
          took=$(( $(date +%s) - start ))
          if [ ! -s "$RUNNER_TEMP/c.json" ]; then echo "BISECT $sha SKIP no census (${took}s)"; tail -5 "$RUNNER_TEMP/run.log"; exit 125; fi
          if grep -qF "$PATTERN" "$RUNNER_TEMP/c.json"; then echo "BISECT $sha BAD (${took}s)"; exit 1; fi
          echo "BISECT $sha GOOD (${took}s)"; exit 0
          PROBE
          chmod +x "$RUNNER_TEMP/probe.sh"
          echo "== bad end (round 0 commit)"
          git checkout -q 60b3ceddc3a55901bda6ee05b1d4413aa265c80c && "$RUNNER_TEMP/probe.sh"
          echo "== good end (10-23 main)"
          git checkout -q bb92e5cb8 && "$RUNNER_TEMP/probe.sh"
          git bisect start 60b3ceddc3a55901bda6ee05b1d4413aa265c80c bb92e5cb8 --first-parent
          git bisect run "$RUNNER_TEMP/probe.sh"
          git bisect log | tail -20
          echo "FIRST_BAD $(git rev-parse refs/bisect/bad) $(git log -n1 --format=%s refs/bisect/bad)"
          grep -F "$PATTERN" "$RUNNER_TEMP/c.json" | head -3 | cut -c1-600
