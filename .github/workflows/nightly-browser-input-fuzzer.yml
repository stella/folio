name: Nightly Browser Input Fuzzer

on:
  schedule:
    # Offset from the existing property, parity, and corpus jobs.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  browser-input-fuzzer:
    name: Browser input fuzzer (nightly seeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      fuzz_outcome: ${{ steps.fuzz.outcome }}
      host_api_outcome: ${{ steps.host-api.outcome }}
      canonical_outcome: ${{ steps.canonical.outcome }}
      interleaving_outcome: ${{ steps.interleaving.outcome }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      - name: Run canonical session property flows
        id: canonical
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/canonical
          bun test ./test/canonical-session.fuzz.ts 2>&1 | tee fuzz-artifacts/canonical/canonical-fuzz.log
        env:
          CI: "true"
          PROPERTY_TEST_NUM_RUNS_FACTOR: "4"
          PROPERTY_TEST_SEED_SALT: canonical-${{ github.run_id }}
          FOLIO_PROPERTY_FAILURES_DIR: fuzz-artifacts/canonical/findings

      - name: Host API flow fuzz
        id: host-api
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/host-api
          bunx playwright test --project=parity-fuzzer tests/parity/host-api-flow.spec.ts --workers=1 --output=fuzz-playwright/host-api 2>&1 | tee fuzz-artifacts/host-api/host-api-fuzz.log
        env:
          CI: "true"
          PROPERTY_TEST_SEED_SALT: host-api-${{ github.run_id }}

      - name: Keep host API findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-api-fuzz
          path: |
            fuzz-artifacts/host-api
            fuzz-playwright/host-api
          retention-days: 14

      - name: Run nightly browser fuzzer
        if: always()
        id: fuzz
        timeout-minutes: 35
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/browser
          fresh_seed=$(date +%s)
          export FOLIO_FUZZ_SEEDS="${FOLIO_FUZZ_SEEDS},${fresh_seed}"
          bunx playwright test --project=browser-fuzzer --workers=1 --output=fuzz-playwright/browser 2>&1 | tee fuzz-artifacts/browser/browser-fuzz.log
        env:
          CI: "true"
          FOLIO_FUZZ_HEALTH: "1"
          FOLIO_FUZZ_LANE: "nightly"
          FOLIO_FUZZ_SEEDS: "11,29,47,83,131,197,263,347,431,557"
          FOLIO_FUZZ_RUNS: "20"

      - name: Check fuzz health
        if: always()
        run: |
          if ! command -v bun >/dev/null || [ ! -f scripts/fuzz-health-check.ts ]; then
            echo "::error::Fuzz infrastructure unavailable before health reporting"
            echo "Fuzz health: **infrastructure**; setup failed before health reporting." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bun scripts/fuzz-health-check.ts fuzz-artifacts/browser/browser-fuzz.log
        env:
          FUZZ_STEP_OUTCOME: ${{ steps.fuzz.outcome }}

      - name: Random AI and human revision interleaving
        if: always()
        id: interleaving
        continue-on-error: true
        timeout-minutes: 12
        env:
          CI: "true"
          FOLIO_FUZZ_LANE: "nightly"
          FOLIO_FUZZ_SEEDS: "11,29,${{ github.run_number }}"
          FOLIO_FUZZ_RUNS: "10"
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/interleaving
          bunx playwright test --project=interleaving-fuzzer --workers=1 --output=fuzz-playwright/interleaving 2>&1 | tee fuzz-artifacts/interleaving/interleaving.log

      - name: Keep interleaving repro artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interleaving-findings
          path: |
            fuzz-artifacts/interleaving
            fuzz-playwright/interleaving
          retention-days: 14

      - name: Keep health log and minimized traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-input-fuzzer
          path: |
            fuzz-artifacts/browser
            fuzz-artifacts/canonical
            fuzz-playwright/browser
          retention-days: 14

      - name: Preserve nightly failure status
        if: always() && (steps.canonical.outcome == 'failure' || steps.fuzz.outcome == 'failure')
        run: exit 1

  report:
    name: File browser fuzz findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && (needs.browser-input-fuzzer.outputs.fuzz_outcome == 'failure' || (needs.browser-input-fuzzer.outputs.fuzz_outcome == 'success' && github.event_name == 'schedule'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: browser-input-fuzzer
      log-pattern: "**/fuzz-artifacts/browser/*.log"
      lane: nightly-browser-input
      result: ${{ needs.browser-input-fuzzer.outputs.fuzz_outcome }}

  interleaving-report:
    name: File AI and human revision interleaving findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && (needs.browser-input-fuzzer.outputs.interleaving_outcome == 'failure' || (needs.browser-input-fuzzer.outputs.interleaving_outcome == 'success' && github.event_name == 'schedule'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: interleaving-findings
      log-pattern: "**/fuzz-artifacts/interleaving/*.log"
      lane: nightly-interleaving
      result: ${{ needs.browser-input-fuzzer.outputs.interleaving_outcome }}

  report-host-api:
    name: File host API findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && (needs.browser-input-fuzzer.outputs.host_api_outcome == 'failure' || (needs.browser-input-fuzzer.outputs.host_api_outcome == 'success' && github.event_name == 'schedule'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: host-api-fuzz
      log-pattern: "**/fuzz-artifacts/host-api/*.log"
      lane: nightly-host-api
      result: ${{ needs.browser-input-fuzzer.outputs.host_api_outcome }}

  report-canonical:
    name: File canonical session findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && (needs.browser-input-fuzzer.outputs.canonical_outcome == 'failure' || (needs.browser-input-fuzzer.outputs.canonical_outcome == 'success' && github.event_name == 'schedule'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: browser-input-fuzzer
      log-pattern: "**/fuzz-artifacts/canonical/*.log"
      lane: nightly-canonical-session
      result: ${{ needs.browser-input-fuzzer.outputs.canonical_outcome }}
