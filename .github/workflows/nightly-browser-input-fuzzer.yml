name: Nightly Browser Input Fuzzer

on:
  schedule:
    # Offset from the existing property, parity, and corpus jobs.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  browser-input-fuzzer:
    name: Browser input fuzzer (nightly seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.fuzz.outcome == 'failure' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      - name: Run nightly browser fuzzer
        id: fuzz
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p test-results
          export FOLIO_FUZZ_SEEDS="${FOLIO_FUZZ_SEEDS},$(date +%s)"
          bunx playwright test --project=browser-fuzzer --workers=1 2>&1 | tee test-results/browser-fuzz.log
        env:
          CI: "true"
          FOLIO_FUZZ_LANE: "nightly"
          FOLIO_FUZZ_SEEDS: "11,29,47,83,131,197,263,347,431,557"
          FOLIO_FUZZ_RUNS: "20"

      - name: Keep minimized traces and browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-input-fuzzer
          path: |
            test-results
            playwright-report
          retention-days: 14

  report:
    name: File browser fuzz findings
    needs: browser-input-fuzzer
    if: always() && needs.browser-input-fuzzer.outputs.findings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fuzz-failure-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: browser-input-fuzzer
          path: fuzz-results
      - name: Open or update findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bun scripts/fuzz-failure-issues.ts --log fuzz-results/test-results/browser-fuzz.log
          --records fuzz-results/test-results/browser-fuzz-failures --run-url "$RUN_URL"
          --sha "$GITHUB_SHA" --source nightly-browser-input
