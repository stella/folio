name: Nightly Browser Input Fuzzer

on:
  schedule:
    # Offset from the existing property, parity, and corpus jobs.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  browser-input-fuzzer:
    name: Browser input fuzzer (nightly seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.fuzz.outcome == 'failure' }}
      host_api_findings: ${{ steps.host-api.outcome == 'failure' }}
      canonical_findings: ${{ steps.canonical.outcome == 'failure' }}
      interleaving_findings: ${{ steps.interleaving.outcome == 'failure' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      - name: Run canonical session property flows
        id: canonical
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/canonical
          bun test ./test/canonical-session.fuzz.ts 2>&1 | tee fuzz-artifacts/canonical/canonical-fuzz.log
        env:
          CI: "true"
          PROPERTY_TEST_NUM_RUNS_FACTOR: "4"
          PROPERTY_TEST_SEED_SALT: canonical-${{ github.run_id }}
          FOLIO_PROPERTY_FAILURES_DIR: fuzz-artifacts/canonical/findings

      - name: Host API flow fuzz
        id: host-api
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/host-api
          bunx playwright test --project=parity-fuzzer tests/parity/host-api-flow.spec.ts --workers=1 --output=fuzz-playwright/host-api 2>&1 | tee fuzz-artifacts/host-api/host-api-fuzz.log
        env:
          CI: "true"
          PROPERTY_TEST_SEED_SALT: host-api-${{ github.run_id }}

      - name: Keep host API findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-api-fuzz
          path: |
            fuzz-artifacts/host-api
            fuzz-playwright/host-api
          retention-days: 14

      - name: Run nightly browser fuzzer
        if: always()
        id: fuzz
        timeout-minutes: 35
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/browser
          fresh_seed=$(date +%s)
          export FOLIO_FUZZ_SEEDS="${FOLIO_FUZZ_SEEDS},${fresh_seed}"
          bunx playwright test --project=browser-fuzzer --workers=1 --output=fuzz-playwright/browser 2>&1 | tee fuzz-artifacts/browser/browser-fuzz.log
        env:
          CI: "true"
          FOLIO_FUZZ_HEALTH: "1"
          FOLIO_FUZZ_LANE: "nightly"
          FOLIO_FUZZ_SEEDS: "11,29,47,83,131,197,263,347,431,557"
          FOLIO_FUZZ_RUNS: "20"

      - name: Check fuzz health
        if: always()
        run: |
          if ! command -v bun >/dev/null || [ ! -f scripts/fuzz-health-check.ts ]; then
            echo "::error::Fuzz infrastructure unavailable before health reporting"
            echo "Fuzz health: **infrastructure**; setup failed before health reporting." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bun scripts/fuzz-health-check.ts fuzz-artifacts/browser/browser-fuzz.log
        env:
          FUZZ_STEP_OUTCOME: ${{ steps.fuzz.outcome }}

      - name: Random AI and human revision interleaving
        if: always()
        id: interleaving
        continue-on-error: true
        timeout-minutes: 12
        env:
          CI: "true"
          FOLIO_FUZZ_LANE: "nightly"
          FOLIO_FUZZ_SEEDS: "11,29,${{ github.run_number }}"
          FOLIO_FUZZ_RUNS: "10"
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/interleaving
          bunx playwright test --project=interleaving-fuzzer --workers=1 --output=fuzz-playwright/interleaving 2>&1 | tee fuzz-artifacts/interleaving/interleaving.log

      - name: Keep interleaving repro artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interleaving-findings
          path: |
            fuzz-artifacts/interleaving
            fuzz-playwright/interleaving
          retention-days: 14

      - name: Keep health log and minimized traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-input-fuzzer
          path: |
            fuzz-artifacts/browser
            fuzz-artifacts/canonical
            fuzz-playwright/browser
          retention-days: 14

      - name: Preserve nightly failure status
        if: always() && (steps.canonical.outcome == 'failure' || steps.fuzz.outcome == 'failure')
        run: exit 1

  report:
    name: File browser fuzz findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && needs.browser-input-fuzzer.outputs.findings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fuzz-failure-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: browser-input-fuzzer
          path: fuzz-results
      - name: Open or update findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bun scripts/fuzz-failure-issues.ts --log fuzz-results/fuzz-artifacts/browser/browser-fuzz.log
          --records fuzz-results/fuzz-artifacts/browser/findings
          --run-url "$RUN_URL"
          --sha "$GITHUB_SHA" --source nightly-browser-input

  interleaving-report:
    concurrency:
      group: fuzz-failure-issues
      cancel-in-progress: false
    name: File AI and human revision interleaving findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && needs.browser-input-fuzzer.outputs.interleaving_findings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: interleaving-findings
          path: fuzz-results
      - name: File findings by fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bun scripts/fuzz-failure-issues.ts
          --log fuzz-results/fuzz-artifacts/interleaving/interleaving.log --records fuzz-results/fuzz-artifacts/interleaving/findings
          --source "AI and human revision interleaving" --run-url "${RUN_URL}" --sha "${GITHUB_SHA}"

  report-host-api:
    name: File host API findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && needs.browser-input-fuzzer.outputs.host_api_findings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fuzz-failure-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: host-api-fuzz
          path: fuzz-results
      - name: Open or update findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bun scripts/fuzz-failure-issues.ts --log fuzz-results/fuzz-artifacts/host-api/host-api-fuzz.log
          --run-url "$RUN_URL"
          --sha "$GITHUB_SHA" --source host-api-fuzz

  report-canonical:
    name: File canonical session findings
    needs: browser-input-fuzzer
    if: always() && github.ref == 'refs/heads/main' && needs.browser-input-fuzzer.outputs.canonical_findings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fuzz-failure-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: browser-input-fuzzer
          path: fuzz-results
      - name: Open or update findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bun scripts/fuzz-failure-issues.ts --log fuzz-results/fuzz-artifacts/canonical/canonical-fuzz.log
          --records fuzz-results/fuzz-artifacts/canonical/findings
          --run-url "$RUN_URL"
          --sha "$GITHUB_SHA" --source canonical-session-fuzz
