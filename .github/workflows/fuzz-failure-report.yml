name: Fuzz failure report

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Artifact name or pattern containing fuzz logs and failure records
        required: true
        type: string
      log-pattern:
        description: Glob of logs relative to the artifact root
        default: "**/*.log"
        required: false
        type: string

permissions: {}

jobs:
  report:
    name: File fuzz failures by fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fuzz-failure-issues
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: false
          path: fuzz-results

      - name: Open or update findings
        run: >-
          bun scripts/fuzz-failure-issues.ts
          --artifact-root fuzz-results --require-failures
          --log-pattern "$LOG_PATTERN" --run-url "$RUN_URL"
        env:
          LOG_PATTERN: ${{ inputs.log-pattern }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
