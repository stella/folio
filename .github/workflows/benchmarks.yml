name: Benchmarks

# Continuous benchmark-regression checking via CodSpeed.
#
# The job runs the tinybench suite under Node (CodSpeed instruments Node, not
# Bun) in CPU-simulation mode, so the numbers are hardware-agnostic and stable
# on shared GitHub runners. Authentication uses OpenID Connect, so no
# long-lived token has to be stored in the repository.

on:
  push:
    branches: [main]
  pull_request:
  # `workflow_dispatch` lets CodSpeed trigger backtest runs to seed baselines.
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Least privilege: read the checkout, and mint an OIDC token for CodSpeed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      # CodSpeed instruments Node, so the bench files must also run there. Bun
      # only installs the dependency tree.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # tsx is a pinned dev dependency, so this runs the committed version and
      # never resolves a fresh one from the registry at benchmark time.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: node --import tsx benchmarks/index.ts
