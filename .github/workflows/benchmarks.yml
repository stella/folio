name: Benchmarks

# On-demand benchmark checking via CodSpeed.
#
# The job runs the tinybench suite under Node (CodSpeed instruments Node, not
# Bun) in CPU-simulation mode, so the numbers are hardware-agnostic and stable
# on shared GitHub runners. Authentication uses OpenID Connect, so no
# long-lived token has to be stored in the repository.
#
on:
  workflow_dispatch:
    inputs:
      corpus:
        description: Benchmark corpus
        type: choice
        options: [fast, full]
        default: fast

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale-complexity:
    name: Scale complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Check scale complexity
        run: node --expose-gc --import tsx benchmarks/scale/run.ts
      - name: Record scale baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-complexity
          path: .cache/performance/scale-complexity.json
          if-no-files-found: error

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    # Least privilege: read the checkout, and mint an OIDC token for CodSpeed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      # CodSpeed instruments Node, so the bench files must also run there. Bun
      # only installs the dependency tree.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # The exact plugin pin includes the Node-API string conversion fix for Node 26.
      - name: Verify CodSpeed native runtime
        run: node --interpreted-frames-native-stack --allow-natives-syntax scripts/check-codspeed-runtime.mjs

      # tsx is a pinned dev dependency, so this runs the committed version and
      # never resolves a fresh one from the registry at benchmark time.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        env:
          FOLIO_BENCH_CORPUS: ${{ inputs.corpus || 'fast' }}
        with:
          mode: simulation
          run: node --import tsx benchmarks/index.ts
