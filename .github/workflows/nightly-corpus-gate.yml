# fuzz-report: none -- Corpus edit checks emit baseline JSON, not FOLIO_FAILURE markers.
name: Nightly Corpus Edit Fuzz

on:
  schedule:
    # 05:57 UTC daily, offset from the nightly property-test (05:17) and parity
    # (05:37) crons so the three jobs don't contend for runners.
    - cron: "57 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  edit-fuzz:
    name: Corpus edit fuzz (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Point the corpus cache outside the checkout
        run: echo "FOLIO_CORPUS_CACHE=$RUNNER_TEMP/folio-corpus" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.425"

      - run: bun install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FOLIO_CORPUS_CACHE }}
          key: folio-corpus-${{ hashFiles('corpus/sources.lock.json') }}

      - name: Fetch the corpus
        run: bun run corpus:fetch

      - name: Build Open XML SDK projector
        run: dotnet build packages/core/scripts/differential/dotnet -c Release

      - name: Run corpus edit fuzz
        run: bun scripts/corpus-edit-fuzz.ts run --shard ${{ matrix.shard }}/4 --out edit-fuzz-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles(format('edit-fuzz-{0}.json', matrix.shard)) != '' }}
        with:
          name: corpus-edit-fuzz-${{ matrix.shard }}
          path: edit-fuzz-${{ matrix.shard }}.json

  edit-fuzz-ratchet:
    name: Corpus edit fuzz baseline ratchet
    needs: edit-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corpus-edit-fuzz-*
          merge-multiple: true

      - name: Ratchet edit findings
        run: bun scripts/corpus-edit-fuzz.ts check edit-fuzz-1.json edit-fuzz-2.json edit-fuzz-3.json edit-fuzz-4.json
