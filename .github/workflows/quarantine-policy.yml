name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/folio'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@3df309c9d97e10b0b4290bb9daefdeda50a6f1bf
