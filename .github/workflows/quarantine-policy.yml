name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/folio'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@3e9057a176377ddfa34d7897025934d1feb7ce9f
    with:
      bun-roots: plugins/vscode
