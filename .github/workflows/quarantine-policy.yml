name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/folio'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@ba5f7da76aededf6f22814de93c72a49843fcc8e
    with:
      bun-roots: plugins/vscode
