name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/folio'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@964e75f409643716a2c8ff29c26235f18d2e34a0
    with:
      bun-roots: plugins/vscode
