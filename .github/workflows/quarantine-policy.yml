name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/folio'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@28dce62a9e1916b19ce03c8c47a1c44e1a145fdf
    with:
      bun-roots: plugins/vscode
