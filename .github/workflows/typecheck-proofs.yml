name: Typecheck proofs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-proofs:
    name: Typecheck proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@ba5f7da76aededf6f22814de93c72a49843fcc8e
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Verify seeded typecheck diagnostic
        run: bunx --no-install stll-typecheck-probe --project packages/core/tsconfig.build.json --seed-dir packages/core/src -- bun check -p packages/core/tsconfig.build.json

  typecheck-budget:
    name: Compiler-work budget
    needs: typecheck-proofs
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"
          no-cache: true

      - run: bun scripts/ci-scoped-install.ts typecheck-budget

      - name: Guard deterministic compiler workload
        run: |
          bun scripts/typecheck-budget.ts --self-test
          bun run typecheck:budget
