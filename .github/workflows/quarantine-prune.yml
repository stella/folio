name: Package quarantine prune

on:
  schedule:
    - cron: "11 4 * * *"

permissions:
  contents: read

jobs:
  prune:
    name: Remove expired quarantine exceptions
    if: github.repository == 'stella/folio'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-prune.yml@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
    with:
      bun-roots: plugins/vscode
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
