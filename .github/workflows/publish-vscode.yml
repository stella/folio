name: Publish VS Code extension

# Manual only. Builds plugins/vscode into one .vsix and publishes that exact
# file to the VS Code Marketplace and Open VSX. Leave `publish` unchecked for
# a build-and-package dry run.
#
# Setup, once:
# - VS Code Marketplace: a Microsoft Entra app registration that is a member of
#   the `stll` publisher, with a federated credential for this repository's
#   `vscode-marketplace` environment
#   (subject `repo:stella/folio:environment:vscode-marketplace`). Set the
#   repository variables VSCE_AZURE_CLIENT_ID and VSCE_AZURE_TENANT_ID.
#   No personal access token is stored.
# - Open VSX: create the `stll` namespace, then store a token as the
#   OVSX_PAT secret of the `open-vsx` environment.
# A registry that is not set up is skipped with a notice.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish (leave unchecked for a build and package dry run)
        type: boolean
        default: false
      marketplace:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: true
      open-vsx:
        description: Publish to Open VSX
        type: boolean
        default: true

concurrency:
  group: publish-vscode
  cancel-in-progress: false

permissions: {}

jobs:
  package:
    name: Build and package the .vsix
    runs-on: ubuntu-latest
    permissions:
      contents: read # No id-token while dependency and build scripts run.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: plugins/vscode

      - name: Plugin versions match the CLI
        run: bun scripts/sync-plugin-cli-version.ts

      - name: Test
        run: bun run test
        working-directory: plugins/vscode

      - name: Package
        run: bun run package
        working-directory: plugins/vscode

      - name: Read the version
        id: version
        working-directory: plugins/vscode
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: folio-vscode-vsix
          path: plugins/vscode/folio.vsix
          if-no-files-found: error

  marketplace:
    name: Publish to the VS Code Marketplace
    needs: package
    if: inputs.publish && inputs.marketplace
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write # Entra ID federated login; no stored token.
    steps:
      - name: Check the setup
        id: setup
        env:
          CLIENT_ID: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.VSCE_AZURE_TENANT_ID }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ]; then
            echo "::notice title=VS Code Marketplace skipped::Set the VSCE_AZURE_CLIENT_ID and VSCE_AZURE_TENANT_ID repository variables to publish. See the header of publish-vscode.yml."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ "$VERSION" = "0.0.0" ]; then
            echo "::notice title=VS Code Marketplace skipped::The extension is at 0.0.0; release @stll/folio-cli first, which sets its version."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.setup.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            plugins/vscode

      - if: steps.setup.outputs.configured == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - if: steps.setup.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - if: steps.setup.outputs.configured == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: plugins/vscode

      - if: steps.setup.outputs.configured == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: folio-vscode-vsix
          path: plugins/vscode

      - if: steps.setup.outputs.configured == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.VSCE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - if: steps.setup.outputs.configured == 'true'
        name: Publish
        working-directory: plugins/vscode
        run: node_modules/.bin/vsce publish --packagePath folio.vsix --azure-credential

  open-vsx:
    name: Publish to Open VSX
    needs: package
    if: inputs.publish && inputs.open-vsx
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - name: Check the setup
        id: setup
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice title=Open VSX skipped::Store an Open VSX token as the OVSX_PAT secret of the open-vsx environment to publish. See the header of publish-vscode.yml."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ "$VERSION" = "0.0.0" ]; then
            echo "::notice title=Open VSX skipped::The extension is at 0.0.0; release @stll/folio-cli first, which sets its version."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.setup.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            plugins/vscode

      - if: steps.setup.outputs.configured == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - if: steps.setup.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - if: steps.setup.outputs.configured == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: plugins/vscode

      - if: steps.setup.outputs.configured == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: folio-vscode-vsix
          path: plugins/vscode

      - if: steps.setup.outputs.configured == 'true'
        name: Publish
        working-directory: plugins/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node_modules/.bin/ovsx publish folio.vsix
