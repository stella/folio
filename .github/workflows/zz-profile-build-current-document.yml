name: Scratch profile (build current document)

on:
  push:
    branches: [scratch/profile-build-current-document]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/bun
      - run: bun install --frozen-lockfile
      - run: git worktree add --detach ../base 1212c0bcb7b03c585300b72fead8cdb95518048c
      - run: bun install --frozen-lockfile
        working-directory: ../base
      - run: bash scripts/zz-profile/pair.sh "$(cd ../base && pwd)" "$RUNNER_TEMP/prof" 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings
          path: ${{ runner.temp }}/prof
          retention-days: 7
