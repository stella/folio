name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] delegates to pinned reusable CLA workflow; never check out PR code here
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: read
    if: >-
      !github.event.repository.private
      && (
        (
          github.event_name == 'pull_request_target'
        ) || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && (
            github.event.comment.body == 'recheck'
            || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
    uses: stella/.github/.github/workflows/cla.yml@042baebaf071329b956555c05caf5736504c278d
    with:
      # Automation accounts cannot sign a CLA, so any app that opens PRs here
      # has to be listed or its every PR fails the check permanently.
      allowlist: dependabot[bot],renovate[bot],github-actions[bot],google-labs-jules[bot],stella-provenance-updater[bot],cursoragent
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
