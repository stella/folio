name: CLA Assistant

on:
  issue_comment:
    types: [created]
  # Pull requests: the unprivileged CLA Request workflow completes, then this
  # default-branch workflow verifies the head it ran on.
  workflow_run: # zizmor: ignore[dangerous-triggers] API-only; the triggering run is untrusted data and nothing from it executes
    workflows: [CLA Request]
    types: [completed]

permissions: {}

jobs:
  cla:
    # Serializes runs for one head or pull request; job level, so unrelated
    # comments (skipped by `if`) never replace a pending check.
    concurrency:
      group: cla-${{ github.event.workflow_run.head_sha || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write # Reports the CLA check on the pull request head.
      issues: write # Maintains the signing prompt.
      pull-requests: read # Resolves the pull request of a triggering run.
    if: >-
      !github.event.repository.private
      && (
        (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'pull_request'
        ) || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && (
            github.event.comment.body == 'recheck'
            || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
    uses: stella/.github/.github/workflows/cla.yml@2664e46f02aea7164ba71bcdd485a686166993a4
    with:
      # Automation accounts cannot sign a CLA, so any app that opens PRs here
      # has to be listed or its every PR fails the check permanently.
      allowlist: dependabot[bot],renovate[bot],github-actions[bot],google-labs-jules[bot],stella-provenance-updater[bot],cursoragent
      # The context the main ruleset requires on pull request heads.
      check-name: cla
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
