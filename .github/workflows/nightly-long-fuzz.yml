name: Nightly Long Flows

on:
  workflow_call:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-long-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  long-fuzz:
    name: 100 pages / ${{ matrix.steps }} steps
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        steps: [200, 500, 1000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Run long flow with a fresh reproducible seed
        run: |
          set -o pipefail
          mkdir -p "$FOLIO_SCENARIO_LONG_OUTPUT"
          export FOLIO_SCENARIO_SEED=$(( (GITHUB_RUN_ID * 7919 + STEPS) % 2147483647 ))
          bun scripts/consumer-scenarios.ts -- long-fuzz.test.ts 2>&1 | tee "$FOLIO_SCENARIO_LONG_OUTPUT/run.log"
        env:
          CI: "true"
          STEPS: ${{ matrix.steps }}
          FOLIO_SCENARIO_LONG_FUZZ: "1"
          FOLIO_SCENARIO_LONG_STEPS: ${{ matrix.steps }}
          FOLIO_SCENARIO_LONG_OUTPUT: ${{ github.workspace }}/test-results/long-fuzz
      - name: Preserve full and minimized traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: long-fuzz-${{ matrix.steps }}
          path: test-results/long-fuzz
          retention-days: 14
          if-no-files-found: error

  report:
    name: File long-flow findings
    needs: long-fuzz
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: long-fuzz-*
      lane: nightly-long-fuzz
      result: ${{ needs.long-fuzz.result }}
