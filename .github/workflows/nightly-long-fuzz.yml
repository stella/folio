name: Nightly Long Flows

on:
  workflow_call:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-long-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  long-fuzz:
    name: 100 pages / ${{ matrix.steps }} steps
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        steps: [200, 500, 1000]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Run long flow with a fresh reproducible seed
        run: |
          set -o pipefail
          mkdir -p "$FOLIO_SCENARIO_LONG_OUTPUT"
          export FOLIO_SCENARIO_SEED=$(( (GITHUB_RUN_ID * 7919 + STEPS) % 2147483647 ))
          bun scripts/consumer-scenarios.ts -- long-fuzz.test.ts 2>&1 | tee "$FOLIO_SCENARIO_LONG_OUTPUT/run.log"
        env:
          CI: "true"
          STEPS: ${{ matrix.steps }}
          FOLIO_SCENARIO_LONG_FUZZ: "1"
          FOLIO_SCENARIO_LONG_STEPS: ${{ matrix.steps }}
          FOLIO_SCENARIO_LONG_OUTPUT: ${{ github.workspace }}/test-results/long-fuzz
      - name: Preserve full and minimized traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: long-fuzz-${{ matrix.steps }}
          path: test-results/long-fuzz
          retention-days: 14
          if-no-files-found: error
