name: scratch s20 replay
on:
  push:
    branches: ["scratch/s20-yjs-replay-*"]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun
        with:
          package-json: package.json
      - run: bun install --frozen-lockfile
      - name: Replay the Yjs room counterexample
        working-directory: packages/core
        env:
          PROPERTY_TEST_SEED: "-195646329"
          PROPERTY_TEST_PATH: "7:3:1:6:9:3:8:15:15:14:14:14:18:20:21:18:18:18:18:18:18:19:19:18:2:2:0:11:11:4:1:1:1:1:3:5:6:6:6:6:6:6:6"
        run: bun test ./src/controller/canonicalYjsRoom.property.test.ts -t "peers of a Yjs-carried room converge on the authority's document" 2>&1 | grep -E "DEBUG|error|fail|pass|Expected|Received" | head -3000
