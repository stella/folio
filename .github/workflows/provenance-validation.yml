name: Inline provenance validation
on: pull_request
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt packages/core/src/compare/inline-provenance.ts
      - run: git diff > provenance-format.patch
      - run: bun test packages/core/src/compare/inline-provenance.test.ts packages/core/src/ai-edits/snapshot.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-format
          path: provenance-format.patch
