name: VS Code extension

# Builds once, then exercises the extension on its minimum editor and stable.
# CI calls this workflow only when the vscode area is selected.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Build and package the .vsix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # The workspace install provides the CLI's dependencies, which the
      # extension bundles; the extension's own install provides its tooling.
      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: plugins/vscode

      - name: Plugin versions match the CLI
        run: bun scripts/sync-plugin-cli-version.ts

      - name: Typecheck
        run: bun run typecheck
        working-directory: plugins/vscode

      - name: Confirm the editor API floor without MCP
        run: bun scripts/check-engine-floor.ts
        working-directory: plugins/vscode

      - name: Test
        run: bun run test
        working-directory: plugins/vscode

      - name: Package
        run: bun run package
        working-directory: plugins/vscode

      - name: Bundled CLI renders a document
        working-directory: plugins/vscode
        run: |
          node dist/cli/folio.mjs render ../../parity/fixtures/layout-kitchen-sink.docx \
            -o "$RUNNER_TEMP/preview.html" --output json | tee "$RUNNER_TEMP/render.json"
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!r.ok || !(r.data.pageCount > 0)) process.exit(1);' "$RUNNER_TEMP/render.json"

      - name: The package carries the editor bundle
        working-directory: plugins/vscode
        run: |
          unzip -l folio.vsix | tee "$RUNNER_TEMP/vsix.txt" > /dev/null
          grep -q 'extension/dist/editor/editor\.js$' "$RUNNER_TEMP/vsix.txt"
          grep -q 'extension/dist/editor/editor\.css$' "$RUNNER_TEMP/vsix.txt"
          grep -q 'extension/dist/editor/fonts/.*\.woff2$' "$RUNNER_TEMP/vsix.txt"

      - name: Cache VS Code for the smoke test
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-1.86.0-stable-${{ github.run_id }}
          restore-keys: vscode-test-${{ runner.os }}-1.86.0-stable-

      # Opens a .docx in a real VS Code with the built extension, types, saves,
      # and reverts (test/smoke).
      - name: Smoke test in VS Code 1.86.0 (no MCP)
        working-directory: plugins/vscode
        env:
          FOLIO_SMOKE_VSCODE_VERSION: "1.86.0"
          FOLIO_SMOKE_MCP: unavailable
        run: xvfb-run -a bun run test:smoke

      - name: Smoke test in current stable VS Code (MCP)
        working-directory: plugins/vscode
        env:
          FOLIO_SMOKE_VSCODE_VERSION: stable
          FOLIO_SMOKE_MCP: registered
        run: xvfb-run -a bun run test:smoke

      - name: Upload the .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: folio-vscode-vsix
          path: plugins/vscode/folio.vsix
          if-no-files-found: error
          retention-days: 14
