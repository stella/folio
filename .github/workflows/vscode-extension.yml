name: VS Code extension

# Builds, tests, and packages extension changes before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/vscode-extension.yml"
      - ".node-version"
      - "LICENSE"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "packages/agents/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/docx-core/**"
      - "packages/editor-web/**"
      - "packages/playground/public/folio-showcase.docx"
      - "packages/react/**"
      - "packages/utf8-boundaries/**"
      - "parity/fixtures/layout-kitchen-sink.docx"
      - "plugins/vscode/**"
      - "scripts/ci-plan.test.ts"
      - "scripts/sync-plugin-cli-version.ts"
      - "tsconfig.base.json"
  merge_group:
    types: [checks_requested]

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'merge_group' || github.event.pull_request.draft != true
    name: Build and package the .vsix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@ba5f7da76aededf6f22814de93c72a49843fcc8e
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The workspace install provides the CLI's dependencies, which the
      # extension bundles; the extension's own install provides its tooling.
      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: plugins/vscode

      - name: Plugin versions match the CLI
        run: bun scripts/sync-plugin-cli-version.ts

      - name: Typecheck
        run: bun run typecheck
        working-directory: plugins/vscode

      - name: Confirm the editor API floor without MCP
        run: bun scripts/check-engine-floor.ts
        working-directory: plugins/vscode

      - name: Test
        run: bun test src test/portable-fuzzy.test.ts
        working-directory: plugins/vscode

      - name: Package
        run: bun run package
        working-directory: plugins/vscode

      - name: Verify the portable CLI package
        run: bun test test/package.test.ts
        working-directory: plugins/vscode

      - name: Bundled CLI renders a document
        working-directory: plugins/vscode
        run: |
          node dist/cli/folio.mjs render ../../parity/fixtures/layout-kitchen-sink.docx \
            -o "$RUNNER_TEMP/preview.html" --output json | tee "$RUNNER_TEMP/render.json"
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!r.ok || !(r.data.pageCount > 0)) process.exit(1);' "$RUNNER_TEMP/render.json"

      - name: The package carries the editor bundle
        working-directory: plugins/vscode
        run: |
          unzip -l folio.vsix | tee "$RUNNER_TEMP/vsix.txt" > /dev/null
          grep -q 'extension/dist/editor/editor\.js$' "$RUNNER_TEMP/vsix.txt"
          grep -q 'extension/dist/editor/editor\.css$' "$RUNNER_TEMP/vsix.txt"
          grep -q 'extension/dist/editor/fonts/.*\.woff2$' "$RUNNER_TEMP/vsix.txt"

      - name: Resolve current stable VS Code for the cache
        id: editor-version
        run: |
          version=$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -er '.[0]')
          echo "stable=$version" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code for the smoke test
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-1.86.0-${{ steps.editor-version.outputs.stable }}
          restore-keys: vscode-test-${{ runner.os }}-1.86.0-

      # Opens a .docx in a real VS Code with the built extension, types, saves,
      # and reverts (test/smoke).
      - name: Smoke test in VS Code 1.86.0 (no MCP)
        working-directory: plugins/vscode
        env:
          FOLIO_SMOKE_VSCODE_VERSION: "1.86.0"
          FOLIO_SMOKE_MCP: unavailable
        run: xvfb-run -a bun run test:smoke

      - name: Smoke test in current stable VS Code (MCP)
        working-directory: plugins/vscode
        env:
          FOLIO_SMOKE_VSCODE_VERSION: stable
          FOLIO_SMOKE_MCP: registered
        run: xvfb-run -a bun run test:smoke

      - name: Upload the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-vscode-vsix
          path: plugins/vscode/folio.vsix
          if-no-files-found: error
          retention-days: 14
