name: Scratch profile (locate)

on:
  push:
    branches: [scratch/locate-profile]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: stella/.github/actions/setup-bun-cached@042baebaf071329b956555c05caf5736504c278d
        with:
          bun-version-file: "package.json"
      - run: bun install --frozen-lockfile
      - run: python3 -I scripts/zz-breaks-locator.py
