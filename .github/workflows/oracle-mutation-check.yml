name: Consumer Oracle Mutation Check

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  oracle-mutations:
    if: github.event_name == 'merge_group'
    name: Packed consumer mutation check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Full-depth runs probe the complete set. The suite packs once, then
      # repacks only folio-core.
      - name: Mutate packed core and require failing consumer scenarios
        run: bun scripts/oracle-mutation-check.ts
