name: Consumer Oracle Mutation Check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "test/consumer-scenarios/**"
      - "test/property-testing.ts"
      - "scripts/oracle-mutation-check.ts"
      - "scripts/consumer-scenarios.ts"
      - "scripts/packaged-consumer-lib.ts"
      - ".github/workflows/oracle-mutation-check.yml"

permissions: {}

jobs:
  oracle-mutations:
    name: Packed consumer mutation check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # PRs probe three common failure classes; scheduled and dispatched runs
      # probe the full set. All modes pack once, then repack only folio-core.
      - name: Mutate packed core and require failing consumer scenarios
        run: bun scripts/oracle-mutation-check.ts ${{ github.event_name == 'pull_request' && '--pr' || '' }}
