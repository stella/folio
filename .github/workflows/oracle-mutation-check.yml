name: Consumer Oracle Mutation Check

on:
  workflow_dispatch:

permissions: {}

jobs:
  oracle-mutations:
    name: Packed consumer mutation check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@fc5f380b18234429cb60682ccfe1537561311e61
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Full-depth runs probe the complete set. The suite packs once, then
      # repacks only folio-core.
      - name: Mutate packed core and require failing consumer scenarios
        run: bun scripts/oracle-mutation-check.ts
