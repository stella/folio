name: Publish

# Keep this filename stable: npm trusted publishing authorizes the local calling
# workflow, even though the privileged release transaction runs in a reusable
# workflow. Build and pack remain here, without an OIDC credential; the central
# workflow validates and publishes the resulting tarballs.

on:
  push:
    branches: [main]
    paths:
      # Changesets owns these files, so ordinary manifest maintenance cannot
      # accidentally start a release transaction.
      - packages/docx-core/CHANGELOG.md
      - packages/core/CHANGELOG.md
      - packages/react/CHANGELOG.md
      - packages/agents/CHANGELOG.md
      - packages/cli/CHANGELOG.md
      - packages/vue/CHANGELOG.md
      - packages/nuxt/CHANGELOG.md
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (leave unchecked for a build + pack dry run)
        type: boolean
        default: false
      source-ref:
        description: Commit or ref to build and publish (defaults to the dispatched commit)
        type: string
        required: false
        default: ""
      artifact-run-id:
        description: Earlier run ID containing exact artifacts for release recovery
        type: string
        required: false
        default: ""

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    name: Build and pack ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [docx-core, core, react, agents, cli, vue, nuxt]
    permissions:
      contents: read # Deliberately no id-token while dependency and build scripts run.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build and pack
        shell: bash
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          case "${PKG}" in
            docx-core) package_name="@stll/docx-core" ;;
            *) package_name="@stll/folio-${PKG}" ;;
          esac
          bun --filter "${package_name}" build

          # These packages keep source-shaped exports in the repository; convert
          # those manifests to their published dist shape before packing. Vue and
          # Nuxt already use dist-shaped export objects.
          case "${PKG}" in
            docx-core|core|react|agents|cli) bun scripts/prepare-publish.ts "packages/${PKG}" ;;
            *) echo "skip prepare-publish for ${PKG} (already dist-shaped)" ;;
          esac

          mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
          (
            cd "packages/${PKG}"
            # Bun rewrites workspace/catalog protocols to concrete versions.
            bun pm pack --destination "${GITHUB_WORKSPACE}/release-artifacts"
          )
          sha256sum release-artifacts/*.tgz > "release-artifacts/SHA256SUMS-${PKG}"

      - name: Upload packed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ matrix.pkg }}
          path: release-artifacts/
          retention-days: 1
          if-no-files-found: error

  release:
    name: Release packages
    needs: pack
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
    permissions:
      actions: read # Recover exact artifacts from a verified earlier publish run.
      contents: write # Create immutable package tags and GitHub releases.
      id-token: write # npm trusted publishing; build scripts ran without this permission.
    # The repository owner publishes this versioned shared contract.
    uses: stella/.github/.github/workflows/npm-independent-release.yml@ef4f0537cdf9b3e8ac36d7ce729acd23017c2cf9 # exact-version npm visibility wait
    with:
      artifact-pattern: npm-tarball-*
      artifact-run-id: ${{ inputs.artifact-run-id }}
      github-latest-package: "@stll/folio-core"
      github-latest-policy: canonical-package
      source-ref: ${{ inputs.source-ref || github.sha }}
      # npm can take about 30 minutes to list a newly published version.
      npm-visibility-timeout-minutes: 45
      package-files: |
        packages/docx-core/package.json
        packages/core/package.json
        packages/react/package.json
        packages/agents/package.json
        packages/cli/package.json
        packages/vue/package.json
        packages/nuxt/package.json

  vscode:
    name: Publish the VS Code extension
    needs: release
    # The extension's version follows @stll/folio-cli, so each release that
    # bumps the CLI publishes it; any other release is a skipped duplicate.
    # Started as its own run rather than called: a called workflow does not
    # see the open-vsx environment's OVSX_PAT, so Open VSX was skipped.
    runs-on: ubuntu-latest
    permissions:
      actions: write # Start publish-vscode.yml, which owns the registry environments.
    steps:
      # publish-vscode.yml publishes only a full SHA already on main, and
      # source-ref here may be a branch or tag: pass the commit it names.
      - name: Start the extension publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source-ref || github.sha }}
        run: |
          sha="$(gh api "repos/$REPO/commits/$SOURCE_REF" --jq .sha)"
          gh workflow run publish-vscode.yml --repo "$REPO" --ref main -f publish=true -f source-ref="$sha"
          echo "Started publish-vscode.yml for $sha: https://github.com/$REPO/actions/workflows/publish-vscode.yml"
