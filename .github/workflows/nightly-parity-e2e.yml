name: Nightly Cross-host Fuzz

on:
  schedule:
    # 05:37 UTC daily, offset from the nightly property-test cron (05:17) so the
    # two jobs don't contend for runners at the same minute.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Replay a PROPERTY_TEST_SEED (blank searches a fresh seed)
        required: false
        type: string
      path:
        description: Replay a PROPERTY_TEST_PATH after shrinking
        required: false
        type: string

permissions: {}

jobs:
  parity-e2e:
    name: Generated cross-host fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      cross_host_outcome: ${{ steps.cross-host.outcome }}

    steps:
      # persist-credentials: false — this job can be manually dispatched on any
      # branch ref, so the checkout token must not linger in the git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@5764ab66e4df84cfd2e642c7d7e4678261e668f8
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      - name: Generated four-host differential
        if: always()
        id: cross-host
        continue-on-error: true
        timeout-minutes: 12
        env:
          PROPERTY_TEST_NUM_RUNS_FACTOR: "4"
          PROPERTY_TEST_SEED_SALT: ${{ github.run_id }}
          PROPERTY_TEST_SEED: ${{ inputs.seed }}
          PROPERTY_TEST_PATH: ${{ inputs.path }}
        run: |
          set -o pipefail
          mkdir -p fuzz-artifacts/cross-host
          bunx playwright test --project=parity-fuzzer tests/parity/cross-host-flow.spec.ts --workers=1 --output=fuzz-playwright/cross-host 2>&1 | tee fuzz-artifacts/cross-host/cross-host.log

      - name: Upload differential repro artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-host-differential-repro
          path: |
            fuzz-artifacts/
            fuzz-playwright/
          retention-days: 14

  cross-host-report:
    name: File four-host differential findings
    needs: parity-e2e
    if: always() && github.ref == 'refs/heads/main' && (needs.parity-e2e.outputs.cross_host_outcome == 'failure' || (needs.parity-e2e.outputs.cross_host_outcome == 'success' && github.event_name == 'schedule'))
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: cross-host-differential-repro
      log-pattern: "**/fuzz-artifacts/cross-host/*.log"
      lane: nightly-cross-host
      result: ${{ needs.parity-e2e.outputs.cross_host_outcome }}
