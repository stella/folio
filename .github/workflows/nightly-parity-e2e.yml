name: Typecheck migration measurements

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: "package.json"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: plugins/vscode
      - name: Measure old and Bun diagnostics with seeded errors
        run: python3 scripts/typecheck-migration-proof.py
      - name: Compare compiler diagnostics across migrated projects
        if: always()
        run: |
          mkdir -p typecheck-migration-results
          set -o pipefail
          bun run typecheck:compiler-parity 2>&1 | tee typecheck-migration-results/compiler-parity.log
      - name: Record parity summary
        if: always()
        run: cat typecheck-migration-results/compiler-parity.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-migration-results
          path: typecheck-migration-results
          retention-days: 14
