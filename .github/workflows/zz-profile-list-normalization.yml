name: Scratch profile pair (list normalization)

on:
  push:
    branches: [scratch/list-normalization-profile]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: stella/.github/actions/setup-bun-cached@042baebaf071329b956555c05caf5736504c278d
        with:
          bun-version-file: "package.json"
      - run: bun install --frozen-lockfile
      - run: git worktree add --detach ../base f8ded35419c688776eabee837e068203d772e6d0
      - run: bun install --frozen-lockfile
        working-directory: ../base
      - run: bash scripts/zz-profile/pair.sh "$(cd ../base && pwd)" "$RUNNER_TEMP/prof" 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profiles
          path: ${{ runner.temp }}/prof
          retention-days: 7
