name: Publish Rust crate

on:
  push:
    branches: [main]
    paths:
      - packages/docx-core/CHANGELOG.md
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io (leave unchecked for a package dry run)
        type: boolean
        default: false

concurrency:
  group: publish-crate-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  package:
    name: Package stella-docx-kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: npm and Cargo version parity
        run: bun run check:docx-kernel-version

      - name: Build registry package
        run: cargo package -p stella-docx-kernel --locked

  publish:
    name: Publish stella-docx-kernel
    needs: package
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: cargo publish -p stella-docx-kernel --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
