          retention-days: 7

  interactions:
    name: Interaction e2e (playground)
    needs: ci-plan
    if: needs.ci-plan.outputs.interactions_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        uses: ./.github/actions/playwright-deps

      # Behaviour specs only (assert document content + editor state). The
      # screenshot baselines (rendering.spec) and perf budgets
      # (editing-performance.spec) are env-specific, so they are not run here;
      # the `interactions` Playwright project builds and starts static previews
      # via the config's webServer.
      - name: Run interaction specs
        run: bun run test:interactions

      - name: Run pinned revision interleaving seeds
        env:
          FOLIO_FUZZ_SEEDS: "11,29"
          FOLIO_FUZZ_RUNS: "1"
        run: bunx playwright test --project=interleaving-fuzzer --workers=1

      # Safe to gate on, unlike the screenshot baselines above: this compares
      # the measurer's width against the painted width, both read from the same
      # browser in one layout pass, so cross-machine font rendering cancels out.
      - name: Run measure/paint parity specs
        run: bun run test:measure-parity

      # Every scroll and navigation ref method must move the real scroll
      # container, in React and Vue alike.
      - name: Scroll navigation parity
        run: bunx playwright test --project=parity tests/parity/scroll-root.spec.ts --workers=1

      # The editor bundle a VS Code webview loads, built and driven under the
      # webview's Content Security Policy against a fake extension.
      - name: Run editor-web webview check
        run: bun --filter @stll/folio-editor-web test:e2e

      - name: Upload failed interaction artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-interactions-failure
          path: test-results/
          retention-days: 7

  differential:
    name: Generated compare fixture schema checks
    needs: ci-plan
    if: needs.ci-plan.outputs.differential_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.425"

      - run: bun install --frozen-lockfile

      - name: Install python-docx (differential reference parser)
        run: python3 -m pip install --break-system-packages python-docx

      - name: Build Open XML SDK differential projector
        run: dotnet build packages/core/scripts/differential/dotnet -c Release

      # The generated round trip also runs in the test job, where there is no
      # .NET validator; here its redlines are schema-checked as well.
      - name: Validate generated compare fixtures and redlines
        run: bun test benchmarks/compare/documents.test.ts benchmarks/compare/generated-roundtrip.test.ts

  consumer-scenarios:
    name: Consumer scenarios (tarballs)
    needs: ci-plan
    if: needs.ci-plan.outputs.packaged_consumer_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      # The scenarios run under Node, as an integrator runs the packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      - name: Build consumer tarballs with the shared runtime
        run: bun scripts/consumer-scenarios.ts --pack-only test-results/consumer-tarballs

      - name: Share consumer tarballs with the minimum runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-scenarios-tarballs
          path: test-results/consumer-tarballs
          retention-days: 1
          if-no-files-found: error

      # Installs docx-core, core, agents and cli tarballs
      # into a project outside the workspace, typechecks the scenarios against
      # the published declarations, and runs them against public entry points
      # only: synthetic documents, act, save, reopen, compare every reader.
      # Generated runs belong to nightly and continuous fuzz; pinned seeds,
      # corpus flows and known-issue regressions block PRs and merge groups.
      - name: Scenarios over packed tarballs
        id: scenarios
        env:
          FOLIO_SCENARIO_FUZZ_RUNS: "0"
          FOLIO_SCENARIO_COLLISION_RUNS: "0"
        run: |
          set -o pipefail
          mkdir -p test-results
          bun scripts/consumer-scenarios.ts --typecheck --tarballs test-results/consumer-tarballs 2>&1 | tee test-results/consumer-scenarios.log

      # Replayed on the group's base when a merge group fails
      # (fuzz-ejection-replay.yml).
      - name: Keep the scenario log of a merge group
        if: always() && steps.scenarios.outcome != 'skipped' && github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-log-consumer-scenarios
          path: test-results/consumer-scenarios.log
          retention-days: 7
          if-no-files-found: ignore

      # Which operation types met which stories, modes, target features and
      # sessions; the run fails on a required cell with no hits.
      - name: Upload the coverage ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-scenarios-coverage
          path: |
            test-results/consumer-scenarios-coverage.json
            test-results/consumer-scenarios-features.json
          retention-days: 14
          if-no-files-found: warn

  consumer-scenarios-minimum:
    name: Consumer scenarios (minimum supported Node)
    needs: [ci-plan, consumer-scenarios]
    if: needs.ci-plan.outputs.packaged_consumer_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      # The published CLI support range owns this job's exact minimum runtime.
      # stll-toolchain.json scopes this engine floor to this package and job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.0.0" # Generated by bun run generate:consumer-node-minimum.

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consumer-scenarios-tarballs
          path: test-results/consumer-tarballs

      - name: Scenarios over shared tarballs on the minimum runtime
        env:
          FOLIO_SCENARIO_FUZZ_RUNS: "0"
          FOLIO_SCENARIO_COLLISION_RUNS: "0"
        run: bun scripts/consumer-scenarios.ts --typecheck --tarballs test-results/consumer-tarballs

      - name: Upload minimum runtime coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-scenarios-minimum-coverage
          path: |
            test-results/consumer-scenarios-coverage.json
            test-results/consumer-scenarios-features.json
          retention-days: 14
          if-no-files-found: warn

  packaged-consumer:
    name: Packaged-consumer build (tarballs)
    needs: ci-plan
    if: needs.ci-plan.outputs.packaged_consumer_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Dependency smoke over every published tarball
        run: bun scripts/packaged-consumer-dependencies.ts --pack-dir test-results/package-tarballs

      - name: Upload packed dependency artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-dependency-tarballs
          path: test-results/package-tarballs/
          retention-days: 1
          if-no-files-found: warn

      - name: Validate published artifacts
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run validate-dist
        env:
          FOLIO_PACKED_TARBALLS: test-results/package-tarballs

      # Installs the same tarballs into a clean-room
      # consumer OUTSIDE the workspace, and runs a production `vite build`. The
      # playground e2e consumes SOURCE and so cannot catch a packaging
      # regression (e.g. a worker `new URL(..., import.meta.url)` target the
      # dist never emits); this build consumes the published TARBALLS.
      - name: Production Vite build over packed tarballs
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run test:packaged-consumer
        env:
          FOLIO_PACKED_TARBALLS: test-results/package-tarballs

      - name: Install Playwright Chromium
        if: needs.ci-plan.outputs.suite_depth == 'full'
        uses: ./.github/actions/playwright-deps

      # Runtime half of the same gate: serve the built consumer and drive it in a
      # browser. Catches failures the build cannot see — a worker that resolves at
      # build time but fails to spawn/execute, and UI strings missing from the
      # shipped runtime catalog (IntlError: MISSING_MESSAGE).
      - name: Runtime smoke over packed tarballs
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run test:packaged-consumer-smoke
        env:
          FOLIO_PACKED_TARBALLS: test-results/package-tarballs

  # The ruleset requires this single check. It evaluates every planned job,
  # including jobs GitHub skipped or cancelled before their first step.
  ci-result:
    name: ci-result
    if: always()
    needs:
      - ci-plan
      - warm-main-caches
      - changeset
      - docs-format
      - lint
      - typecheck
      - build-api
      - browser-discovery
      - tests-1
      - tests-2
      - tests-3
      - tests-4
      - container-contract
      - docx-kernel
      - browser-input-pinned
      - canonical-evaluation-regressions
      - interactions
      - differential
      - consumer-scenarios
      - consumer-scenarios-minimum
      - packaged-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Evaluate CI outcome
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ toJSON(needs.ci-plan.outputs) }}
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          JOB_SCOPES: >-
            {"changeset":{"event":"pull_request"},
            "browser-discovery":{"event":"pull_request","area":"browser_discovery_required"},
            "docs-format":{"area":"code_required","value":"false","reuse":"forbidden"},
            "lint":{"reuse":"forbidden"},
            "warm-main-caches":{"event":"push","reuse":"required","warm":"required"},
            "typecheck":{"area":"code_required"},
            "build-api":{"area":"api_required"},
            "tests-1":{"area":"code_required"},
            "tests-2":{"area":"code_required"},
            "tests-3":{"area":"code_required"},
            "tests-4":{"area":"code_required"},
            "container-contract":{"area":"container_contract_required","depth":"full"},
            "docx-kernel":{"area":"docx_kernel_required","depth":"full"},
            "browser-input-pinned":{"area":"interactions_required"},
            "canonical-evaluation-regressions":{"area":"interactions_required"},
            "interactions":{"area":"interactions_required","depth":"full"},
            "differential":{"area":"differential_required","depth":"full"},
            "consumer-scenarios":{"area":"packaged_consumer_required"},
            "consumer-scenarios-minimum":{"area":"packaged_consumer_required"},
            "packaged-consumer":{"area":"packaged_consumer_required"}}
        run: |
          if [[ "$PLAN_RESULT" == "skipped" ]]; then
            if [[ "$EVENT" != "pull_request" ]]; then
              echo "::error::CI plan skipped outside a pull request."
              exit 1
            fi
            # Read the current state: a push can race with ready_for_review.
            draft=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .draft)
            if [[ "$draft" != "true" ]]; then
              echo "::error::CI plan skipped but the pull request is ready."
              exit 1
            fi
            exit 0
          fi
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI plan did not succeed ($PLAN_RESULT)."
            exit 1
          fi
          reused_run=$(jq -r '.reused_run // ""' <<< "$PLAN")
          if [[ -n "$reused_run" ]]; then
            if [[ "$EVENT" != "push" || ! "$reused_run" =~ ^[1-9][0-9]*$ ]] ||
                ! jq -e '.trusted == "true"' <<< "$PLAN" >/dev/null; then
              echo "::error::Invalid merge-group reuse plan."
              exit 1
            fi
            if ! jq -e --argjson plan "$PLAN" '
              [.[] | .area // empty] | unique | all(.[]; $plan[.] == "false")
            ' <<< "$JOB_SCOPES" >/dev/null || ! jq -e '
              [. | to_entries[] | select(.key | endswith("_required"))] |
              length > 0 and all(.[]; .value == "false")
            ' <<< "$PLAN" >/dev/null; then
              echo "::error::Reused coverage must deselect every correctness area."
              exit 1
            fi
            if ! jq -e --argjson scopes "$JOB_SCOPES" '
              . as $needs | [$scopes | keys[] | select(. != "warm-main-caches")] |
              all(.[]; $needs[.].result == "skipped")
            ' <<< "$NEEDS" >/dev/null; then
              echo "::error::Reused coverage requires skipped correctness jobs."
              exit 1
            fi
            warm_result=$(jq -r '.["warm-main-caches"].result // "missing"' <<< "$NEEDS")
            warm_selected=$(jq -r '.warm_caches // "false"' <<< "$PLAN")
            if [[ ( "$warm_selected" == "true" && "$warm_result" != "success" ) ||
                  ( "$warm_selected" == "false" && "$warm_result" != "skipped" ) ||
                  ( "$warm_selected" != "true" && "$warm_selected" != "false" ) ]]; then
              echo "::error::Cache warming did not satisfy the reused plan."
              exit 1
            fi
            printf 'Reused merge-group run [%s](https://github.com/%s/actions/runs/%s)\n' \
              "$reused_run" "$REPO" "$reused_run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          depth=$(jq -r .suite_depth <<< "$PLAN")
          trusted=$(jq -r .trusted <<< "$PLAN")
          toolchain_changed=$(jq -r .toolchain_changed <<< "$PLAN")
          if [[ "$toolchain_changed" != "true" && "$toolchain_changed" != "false" ]]; then
            echo "::error::CI plan has no valid toolchain change result."
            exit 1
          fi
          expected_depth=fast
          if [[ "$EVENT" == "merge_group" || "$toolchain_changed" == "true" ]]; then
            expected_depth=full
            if ! jq -e --argjson plan "$PLAN" '[.[] | .area // empty] | unique | all(.[]; $plan[.] == "true")' <<< "$JOB_SCOPES" >/dev/null; then
              echo "::error::Full-suite CI plan must select every area."
              exit 1
            fi
          fi
          if [[ "$trusted" != "true" || "$depth" != "$expected_depth" ]]; then
            echo "::error::CI plan is untrusted or selects the wrong suite depth for $EVENT."
            exit 1
          fi
          violations=$(jq -r --arg event "$EVENT" --arg depth "$depth" --argjson plan "$PLAN" --argjson scopes "$JOB_SCOPES" '
            . as $needs | [$scopes | to_entries[] | .key as $job | .value as $scope
              | $needs[$job].result as $result
              | (($scope.event == null or $scope.event == $event) and
                 ($scope.reuse != "required") and ($scope.warm != "required") and
                 ($scope.area == null or
                  ($plan[$scope.area] == ($scope.value // "true") and
                   ($scope.depth == null or $scope.depth == $depth)))) as $selected
              | if $selected and $result != "success" then "\($job) (selected, \($result // "missing"))"
                elif ($selected | not) and $result != "success" and $result != "skipped" then
                  "\($job) (unexpected \($result // "missing"))"
                else empty end] | join(", ")' <<< "$NEEDS")
          if [[ -n "$violations" ]]; then
            echo "::error::CI checks did not succeed: $violations"
            exit 1
          fi
          echo "CI checks succeeded."
