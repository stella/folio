name: CI

env:
  HAWK_RUST_TOOLCHAIN: "1.97.1"
  HAWK_VERSION: "0.1.11"
  HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256: "8380db63360ae94f9890d7e426cce00e479d884f516614cea998c85d5f30ab6d"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present for published package src changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need history to compute the merge base with main
          persist-credentials: false

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@c47bb87cc82047b5fdc2540983148d4e3efa9a37 # v1.3.0
        with:
          release-paths: |
            crates/docx-kernel/Cargo.toml
            crates/docx-kernel/src/**
            crates/text-shaper/Cargo.toml
            crates/text-shaper/src/**
            packages/docx-core/src/**
            packages/core/src/**
            packages/react/src/**
            packages/agents/src/**
            packages/vue/src/**
            packages/nuxt/src/**
          generated-paths: |
            Cargo.lock
            Cargo.toml
            bun.lock
            packages/docx-core/src/generated/**
            packages/core/src/generated/**
            packages/docx-core/CHANGELOG.md
            packages/docx-core/package.json
            packages/core/CHANGELOG.md
            packages/core/package.json
            packages/react/CHANGELOG.md
            packages/react/package.json
            packages/agents/CHANGELOG.md
            packages/agents/package.json
            packages/vue/CHANGELOG.md
            packages/vue/package.json
            packages/nuxt/CHANGELOG.md
            packages/nuxt/package.json
          package-files: |
            packages/docx-core/package.json
            packages/core/package.json
            packages/react/package.json
            packages/agents/package.json
            packages/vue/package.json
            packages/nuxt/package.json
          version-file: bun.lock

  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # `--frozen-lockfile` above only checks that the dependency graph still
      # satisfies bun.lock; it does not notice a workspace's cached "version"
      # field drifting behind its package.json (a plain `bun install` doesn't
      # rewrite that field either. The release path uses the same script in
      # byte-preserving --write mode; CI keeps it in check-only mode.
      - name: Lockfile workspace-version check
        run: bun run check:lockfile-versions

      - name: Lockfile deduplication check
        run: bun run check:dedupe

      - name: Quarantine-exclude guard
        # The 5-day release-age quarantine is excluded per package for the
        # first-party @stll/* code folio pulls from npm, and bun matches those
        # entries EXACTLY (a `@stll/*` glob is accepted and ignored). List a
        # napi package without its platform subpackages and the parent installs
        # while its binaries stay quarantined — and a quarantined
        # optionalDependency is skipped SILENTLY, so the package imports fine
        # and throws on first use. This fails when the exclude list stops
        # covering everything in the lock. Temporary third-party exemptions
        # carry an exact expiry so the same check also fails once Bun's
        # release-age gate can take over again. The guard's own self-test runs
        # with `bun run test` below.
        run: bun run check:quarantine-excludes

      - name: Normalisation warning coverage
        # Folio's tolerance rule is that input Word accepts is normalised
        # rather than refused, with a structured warning. A normaliser that
        # reports nothing changes the document in silence, and nothing about
        # writing one makes the author reach for the warning channel. This
        # fails when a normalisation module neither names a warning code nor
        # states why it loses nothing.
        run: bun run check:normalization-warnings

      - name: Dependency audit
        run: bun run audit

      - name: Lint
        run: bun run lint

      - name: Workspace dependency boundaries
        run: bun run check:dependencies

      - name: Format check
        run: bun run format:check

      - name: i18n check
        run: bun run check:i18n

      # Only the `shaping` profile: fetching every source would pull a 43 MB
      # specification archive and a git clone for two small UCD text files.
      - name: Fetch Unicode shaping sources
        run: bun run specifications:fetch --profile shaping

      - name: Unicode joining tables up to date
        run: bun run generate:joining-types:check

      - name: Strict value encodings up to date
        run: bun run generate:strict-value-encodings:check

      # The theme-colour vocabularies. Two enumerations spell one colour
      # differently, so a hand-written union drifts silently and the token it
      # omits is dropped at parse time.
      - name: Theme colour enumerations up to date
        run: bun run generate:theme-colors:check

      # The dispatched containers' declared-child lists, which make each
      # handler map total: a schema refresh that adds a child fails here
      # rather than letting the child be dropped without a decision.
      - name: Container child lists up to date
        run: bun run generate:container-children:check

      # Both halves of the reserved-value contract. The registry is total over
      # the model at compile time; these cover the schema side (no slot that can
      # carry a reserved value is undecided) and the reader side (no new bare
      # comparison against a sentinel).
      - name: Reserved values covered over the schema graph
        run: bun run check:reserved-value-coverage

      - name: Bare reserved-value comparisons only shrink
        run: bun run check:reserved-values

      # The corpus gate itself is nightly: it downloads a hundred megabytes and
      # takes the better part of an hour, so no pull request can ratchet the
      # recorded numbers. This asks the cheap question instead, over committed
      # files alone: whether the baselines, the refusal list and the report-only
      # list are internally consistent and still describe the committed lock.
      # A corpus-only change would otherwise reach main with nothing that reads
      # what it changed.
      - name: Corpus baselines are internally consistent
        run: bun run check:corpus-baselines

      # Both halves of the identity-attribute contract. The set is derived from
      # the schema graph and the extension vocabularies; these cover the
      # derivation (it still matches the graph) and the reader side (no new
      # attribute identity resolved through a prefix).
      - name: Identity attributes up to date
        run: bun run generate:identity-attributes:check

      - name: Prefix-resolved identity reads only shrink
        run: bun run check:identity-attributes

      - name: Adapter parity contract (React <-> Vue props/ref)
        run: bun run check:parity-contract

      - name: Adapter export parity (React <-> Vue public exports)
        run: bun run check:export-parity

      - name: React Compiler bailout guard
        # The compiler skips some imperative ProseMirror/ref-heavy components.
        # Guard their manual memoization so a cleanup cannot create render loops.
        run: bun run check:react-compiler

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The gate builds each package twice and compares the emitted JavaScript
      # and declarations, which costs roughly two extra minutes across all six.
      # A pull request pays it for the two that carry nearly all the declaration
      # surface; push to main covers the adapters too. Either step leaves a
      # freshly built dist behind for the steps below.
      - name: Reproducible package builds
        if: github.event_name == 'pull_request'
        run: bun scripts/check-build-reproducibility.ts --packages core,docx-core

      - name: Reproducible package builds (all published packages)
        if: github.event_name == 'push'
        run: bun run check:build-reproducibility

      - name: API surface report
        id: api-surface-report
        run: |
          bun scripts/api-surface-budget.ts --self-test
          bun run api:check
          bun run api:budget

      # The failure prints a diff, but the regenerated tree is what a reader
      # copies over `api-reports/` when the runner and their machine disagree.
      - name: Upload regenerated API reports after a surface failure
        if: failure() && steps.api-surface-report.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-reports-regenerated
          path: .cache/api-reports/
          retention-days: 1
          if-no-files-found: error

      - name: Validate dist
        run: bun run validate-dist

  typecheck-budget:
    name: Typecheck cost budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Guard deterministic compiler workload
        run: |
          bun scripts/typecheck-budget.ts --self-test
          bun run typecheck:budget

  docx-kernel:
    name: DOCX kernel (Rust and WebAssembly)
    runs-on: ubuntu-latest
    env:
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install pinned Rust toolchain and WebAssembly target
        run: rustup show active-toolchain && rustup target add wasm32-unknown-unknown

      - name: Install pinned Hawk
        shell: bash
        run: |
          set -euo pipefail
          expected_hawk_script="cargo +${HAWK_RUST_TOOLCHAIN} hawk check --target-dir target/hawk -D warnings -A hawk::dead_public -A hawk::unnecessary_public"
          jq -e --arg expected "$expected_hawk_script" \
            '.scripts["rust:hawk"] == $expected' package.json >/dev/null
          archive="$RUNNER_TEMP/cargo-hawk.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-hawk"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            -o "$archive" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"
          rustup toolchain install "$HAWK_RUST_TOOLCHAIN" --profile minimal

      - name: Install matching wasm-bindgen CLI
        run: |
          mapfile -t versions < <(cargo metadata --locked --format-version 1 --features wasm | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | .[]')
          if (( ${#versions[@]} != 1 )); then
            echo "expected exactly one wasm-bindgen version, found: ${versions[*]:-none}" >&2
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "${versions[0]}" --locked

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: |
          cargo test -p stella-docx-kernel
          cargo test -p stella-text-shaper

      - name: Rust lint
        run: |
          cargo clippy -p stella-docx-kernel --all-targets -- -D warnings
          cargo clippy -p stella-docx-kernel --lib --features wasm --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p stella-text-shaper --all-targets -- -D warnings
          cargo clippy -p stella-text-shaper --lib --features wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Hawk visibility lint
        run: bun run rust:hawk

      - name: Registry package
        run: cargo package -p stella-docx-kernel --locked

      - name: npm and Cargo version parity
        run: bun run check:docx-kernel-version

      - name: Generate canonical single-thread WebAssembly and enforce size budgets
        run: |
          bun --filter '@stll/docx-core' wasm:generate
          bun --filter '@stll/folio-core' wasm:generate

      - name: Verify canonical WebAssembly artifacts are committed
        run: |
          drift="$(git status --porcelain=v1 --untracked-files=all -- packages/docx-core/src/generated packages/core/src/generated)"
          if [[ -n "${drift}" ]]; then
            echo "canonical WebAssembly artifacts are stale or untracked:" >&2
            echo "${drift}" >&2
            exit 1
          fi

      - name: Upload canonical WebAssembly artifacts after a drift failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-wasm
          path: |
            packages/docx-core/src/generated/
            packages/core/src/generated/
          retention-days: 1
          if-no-files-found: error

  interactions:
    name: Interaction e2e (playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      # Behaviour specs only (assert document content + editor state). The
      # screenshot baselines (rendering.spec) and perf budgets
      # (editing-performance.spec) are env-specific, so they are not run here;
      # the `interactions` Playwright project starts the playground dev server
      # via the config's webServer.
      - name: Run interaction specs
        run: bun run test:interactions

      # Safe to gate on, unlike the screenshot baselines above: this compares
      # the measurer's width against the painted width, both read from the same
      # browser in one layout pass, so cross-machine font rendering cancels out.
      - name: Run measure/paint parity specs
        run: bun run test:measure-parity

  differential:
    name: Differential parser parity (folio vs python-docx + Open XML SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - run: bun install --frozen-lockfile

      - name: Install python-docx (differential reference parser)
        run: python3 -m pip install --break-system-packages python-docx

      - name: Build Open XML SDK differential projector
        run: dotnet build packages/core/scripts/differential/dotnet -c Release

      # DIFFERENTIAL_REQUIRED turns a missing reference into a failure rather
      # than a skip, so the full-corpus parity gate cannot silently pass.
      - name: Differential parity (full corpus)
        run: bun run test:differential
        env:
          DIFFERENTIAL_REQUIRED: "1"

  packaged-consumer:
    name: Packaged-consumer build (tarballs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # Builds + packs both packages, installs the tarballs into a clean-room
      # consumer OUTSIDE the workspace, and runs a production `vite build`. The
      # playground e2e consumes SOURCE and so cannot catch a packaging
      # regression (e.g. a worker `new URL(..., import.meta.url)` target the
      # dist never emits); this build consumes the published TARBALLS.
      - name: Production Vite build over packed tarballs
        run: bun run test:packaged-consumer

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      # Runtime half of the same gate: serve the built consumer and drive it in a
      # browser. Catches failures the build cannot see — a worker that resolves at
      # build time but fails to spawn/execute, and UI strings missing from the
      # shipped runtime catalog (IntlError: MISSING_MESSAGE).
      - name: Runtime smoke over packed tarballs
        run: bun run test:packaged-consumer-smoke
