name: CI

env:
  HAWK_RUST_TOOLCHAIN: "1.97.1"
  HAWK_VERSION: "0.1.11"
  HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256: "8380db63360ae94f9890d7e426cce00e479d884f516614cea998c85d5f30ab6d"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue checks main plus the queued pull requests before merging,
  # so every job the queue may require also runs here, at full depth.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present for published package src changes
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need history to compute the merge base with main
          persist-credentials: false

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@c47bb87cc82047b5fdc2540983148d4e3efa9a37 # v1.3.0
        with:
          release-paths: |
            crates/docx-kernel/Cargo.toml
            crates/docx-kernel/src/**
            crates/text-shaper/Cargo.toml
            crates/text-shaper/src/**
            packages/docx-core/src/**
            packages/core/src/**
            packages/react/src/**
            packages/agents/src/**
            packages/cli/src/**
            packages/vue/src/**
            packages/nuxt/src/**
          generated-paths: |
            Cargo.lock
            Cargo.toml
            bun.lock
            packages/docx-core/src/generated/**
            packages/core/src/generated/**
            packages/docx-core/CHANGELOG.md
            packages/docx-core/package.json
            packages/core/CHANGELOG.md
            packages/core/package.json
            packages/react/CHANGELOG.md
            packages/react/package.json
            packages/agents/CHANGELOG.md
            packages/agents/package.json
            packages/cli/CHANGELOG.md
            packages/cli/package.json
            packages/vue/CHANGELOG.md
            packages/vue/package.json
            packages/nuxt/CHANGELOG.md
            packages/nuxt/package.json
            plugins/claude-code/.claude-plugin/plugin.json
            plugins/claude-code/.mcp.json
            plugins/herdr/bin/folio-command.sh
            plugins/herdr/herdr-plugin.toml
            plugins/vscode/package.json
          package-files: |
            packages/docx-core/package.json
            packages/core/package.json
            packages/react/package.json
            packages/agents/package.json
            packages/cli/package.json
            packages/vue/package.json
            packages/nuxt/package.json
          version-file: bun.lock

  # One scheduling wave decides what the run checks; every other job waits on
  # it and skips when its area is not selected. The planner is the shared
  # stella/.github ci-plan action; `.github/ci-plan.json` holds folio's areas.
  # Pull requests plan by changed path. Merge groups select every area.
  # Suite depth depends only on the event; the shared planner supplies path
  # scopes and trust. Drafts plan nothing until marked ready for review.
  ci-plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The shared planner reads PR metadata and checks merge-group trust.
      pull-requests: read
      actions: read
    outputs:
      suite_depth: ${{ github.event_name == 'merge_group' && 'full' || 'fast' }}
      trusted: ${{ steps.plan.outputs.trusted }}
      code_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).code }}
      typecheck_budget_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).typecheck_budget }}
      container_contract_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).container_contract }}
      docx_kernel_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).docx_kernel }}
      interactions_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).interactions }}
      differential_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).differential }}
      consumer_scenarios_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).consumer_scenarios }}
      packaged_consumer_required: ${{ github.event_name == 'merge_group' || fromJSON(steps.plan.outputs.areas).packaged_consumer }}
    steps:
      - name: Plan changed-path scopes
        id: plan
        uses: stella/.github/.github/actions/ci-plan@37bfa04a893d1ae2b9d28379cf68e8360781c8bc # v1.8.0
        with:
          policy-file: .github/ci-plan.json

  property-areas:
    name: Properties of the changed areas (5x runs)
    needs: ci-plan
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need history to compute the merge base with the target branch
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # Rerun properties in the areas this PR changes at five times their
      # normal runs, with the same commit-derived seeds.
      - name: Changed areas' properties at 5x numRuns
        run: bun scripts/property-areas.ts --base "origin/${BASE_REF}" --factor 5 --shard "${PROPERTY_SHARD}/${PROPERTY_SHARD_COUNT}"
        env:
          BASE_REF: ${{ github.base_ref }}
          PROPERTY_SHARD: ${{ matrix.shard }}
          PROPERTY_SHARD_COUNT: ${{ strategy.job-total }}

  # oxfmt formats Markdown too, so a documentation-only change still has its
  # formatting checked; any other change runs the full format check in `lint`.
  docs-format:
    name: Format check (documentation only)
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

  lint:
    name: Lint and source guards
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # `--frozen-lockfile` above only checks that the dependency graph still
      # satisfies bun.lock; it does not notice a workspace's cached "version"
      # field drifting behind its package.json (a plain `bun install` doesn't
      # rewrite that field either. The release path uses the same script in
      # byte-preserving --write mode; CI keeps it in check-only mode.
      - name: Lockfile workspace-version check
        run: bun run check:lockfile-versions

      - name: Lockfile deduplication check
        run: bun run check:dedupe

      - name: Quarantine-exclude guard
        # The 5-day release-age quarantine is excluded per package for the
        # first-party @stll/* code folio pulls from npm, and bun matches those
        # entries EXACTLY (a `@stll/*` glob is accepted and ignored). List a
        # napi package without its platform subpackages and the parent installs
        # while its binaries stay quarantined — and a quarantined
        # optionalDependency is skipped SILENTLY, so the package imports fine
        # and throws on first use. This fails when the exclude list stops
        # covering everything in the lock. Temporary third-party exemptions
        # carry an exact expiry so the same check also fails once Bun's
        # release-age gate can take over again. The guard's own self-test runs
        # with `bun run test` below.
        run: bun run check:quarantine-excludes

      - name: Normalisation warning coverage
        # Folio's tolerance rule is that input Word accepts is normalised
        # rather than refused, with a structured warning. A normaliser that
        # reports nothing changes the document in silence, and nothing about
        # writing one makes the author reach for the warning channel. This
        # fails when a normalisation module neither names a warning code nor
        # states why it loses nothing.
        run: bun run check:normalization-warnings

      - name: Dependency audit
        run: bun run audit

      - name: Lint
        run: bun run lint

      - name: Workspace dependency boundaries
        run: bun run check:dependencies

      - name: Format check
        run: bun run format:check

      - name: i18n check
        run: bun run check:i18n

      # Only the `shaping` profile: fetching every source would pull a 43 MB
      # specification archive and a git clone for two small UCD text files.
      - name: Fetch Unicode shaping sources
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run specifications:fetch --profile shaping

      - name: Unicode joining tables up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:joining-types:check

      - name: Strict value encodings up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:strict-value-encodings:check

      # The names ECMA-376 Part 1 spells by writing direction, derived from the
      # cited rename list and the committed graph.
      - name: Strict names up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:strict-names:check

      # The tolerance stays in the one reader that consults the table, so a
      # parser cannot grow a second, unmeasured copy of the same equivalence.
      - name: No reader hand-lists a Strict spelling
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:strict-name-tolerance

      # The theme-colour vocabularies. Two enumerations spell one colour
      # differently, so a hand-written union drifts silently and the token it
      # omits is dropped at parse time.
      - name: Theme colour enumerations up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:theme-colors:check

      # The model enumerations that stand for an OOXML simple type. A member
      # the format declares and the union omits is dropped at parse time and
      # never reaches the writer, so the lists are generated rather than kept
      # by hand.
      - name: OOXML enumerations up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:ooxml-enumerations:check

      # The dispatched containers' declared-child lists, which make each
      # handler map total: a schema refresh that adds a child fails here
      # rather than letting the child be dropped without a decision.
      - name: Container child lists up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:container-children:check

      # `ST_Border`, which `BorderSpec.style` is typed with. A schema refresh
      # that adds a member fails here rather than widening the union silently,
      # and the CSS rendering table is total over it at compile time.
      - name: Border styles up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:border-styles:check

      # `ST_PresetLineDashVal`, which `ShapeOutline.dash` is typed with. Each
      # painter's dash table is total over it at compile time, so a schema
      # refresh that adds a member fails here rather than leaving one table
      # short of the vocabulary it resolves.
      - name: Preset line dashes up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:preset-line-dash:check

      # Both halves of the reserved-value contract. The registry is total over
      # the model at compile time; these cover the schema side (no slot that can
      # carry a reserved value is undecided) and the reader side (no new bare
      # comparison against a sentinel).
      - name: Reserved values covered over the schema graph
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:reserved-value-coverage

      - name: Bare reserved-value comparisons only shrink
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:reserved-values

      # The corpus gate itself is nightly: it downloads a hundred megabytes and
      # takes the better part of an hour, so no pull request can ratchet the
      # recorded numbers. This asks the cheap question instead, over committed
      # files alone: whether the baselines, the refusal list and the report-only
      # list are internally consistent and still describe the committed lock.
      # A corpus-only change would otherwise reach main with nothing that reads
      # what it changed.
      - name: Corpus baselines are internally consistent
        run: bun run check:corpus-baselines

      # Both halves of the identity-attribute contract. The set is derived from
      # the schema graph and the extension vocabularies; these cover the
      # derivation (it still matches the graph) and the reader side (no new
      # attribute identity resolved through a prefix).
      - name: Identity attributes up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:identity-attributes:check

      - name: Fuzz attribute schema facts up to date
        run: bun scripts/generate-fuzz-schema.ts check

      - name: Prefix-resolved identity reads only shrink
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:identity-attributes

      - name: Adapter parity contract (React <-> Vue props/ref)
        run: bun run check:parity-contract

      - name: Adapter export parity (React <-> Vue public exports)
        run: bun run check:export-parity

      - name: React Compiler bailout guard
        # The compiler skips some imperative ProseMirror/ref-heavy components.
        # Guard their manual memoization so a cleanup cannot create render loops.
        run: bun run check:react-compiler

  typecheck:
    name: Typecheck
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  build-api:
    name: Build reproducibility and API reports
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run build

      - name: Reproducible package builds (all published packages)
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:build-reproducibility

      - name: API surface report
        id: api-surface-report
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: |
          bun scripts/api-surface-budget.ts --self-test
          bun run api:check
          bun run api:budget

      # The failure prints a diff, but the regenerated tree is what a reader
      # copies over `api-reports/` when the runner and their machine disagree.
      - name: Upload regenerated API reports after a surface failure
        if: failure() && steps.api-surface-report.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-reports-regenerated
          path: .cache/api-reports/
          retention-days: 1
          if-no-files-found: error

  validate-dist:
    name: Published package validation
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Validate dist
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run validate-dist

  tests-1:
    name: Focused and full tests (1/4)
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # fast-depth selection diffs the PR merge base
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Focused unit tests
        run: bun scripts/ci-test-shards.ts --shard 1 --depth fast
        env:
          CI_TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Full test suite
        id: full-suite
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: |
          set -o pipefail
          mkdir -p test-results
          bun scripts/ci-test-shards.ts --shard 1 --depth full 2>&1 | tee test-results/full-test-suite.log

      # Replay consumes every fuzz-log-* artifact; each shard keeps its own log.
      - name: Keep the test log of a failed merge group
        if: failure() && steps.full-suite.outcome == 'failure' && github.event_name == 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-log-full-test-suite-1
          path: test-results/full-test-suite.log
          retention-days: 7
          if-no-files-found: error

  tests-2:
    name: Focused and full tests (2/4)
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # fast-depth selection diffs the PR merge base
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Focused unit tests
        run: bun scripts/ci-test-shards.ts --shard 2 --depth fast
        env:
          CI_TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Full test suite
        id: full-suite
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: |
          set -o pipefail
          mkdir -p test-results
          bun scripts/ci-test-shards.ts --shard 2 --depth full 2>&1 | tee test-results/full-test-suite.log

      # Replay consumes every fuzz-log-* artifact; each shard keeps its own log.
      - name: Keep the test log of a failed merge group
        if: failure() && steps.full-suite.outcome == 'failure' && github.event_name == 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-log-full-test-suite-2
          path: test-results/full-test-suite.log
          retention-days: 7
          if-no-files-found: error

  tests-3:
    name: Focused and full tests (3/4)
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # fast-depth selection diffs the PR merge base
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Focused unit tests
        run: bun scripts/ci-test-shards.ts --shard 3 --depth fast
        env:
          CI_TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Full test suite
        id: full-suite
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: |
          set -o pipefail
          mkdir -p test-results
          bun scripts/ci-test-shards.ts --shard 3 --depth full 2>&1 | tee test-results/full-test-suite.log

      # Replay consumes every fuzz-log-* artifact; each shard keeps its own log.
      - name: Keep the test log of a failed merge group
        if: failure() && steps.full-suite.outcome == 'failure' && github.event_name == 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-log-full-test-suite-3
          path: test-results/full-test-suite.log
          retention-days: 7
          if-no-files-found: error

  tests-4:
    name: Focused and full tests (4/4)
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # fast-depth selection diffs the PR merge base
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Focused unit tests
        run: bun scripts/ci-test-shards.ts --shard 4 --depth fast
        env:
          CI_TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Full test suite
        id: full-suite
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: |
          set -o pipefail
          mkdir -p test-results
          bun scripts/ci-test-shards.ts --shard 4 --depth full 2>&1 | tee test-results/full-test-suite.log

      # Replay consumes every fuzz-log-* artifact; each shard keeps its own log.
      - name: Keep the test log of a failed merge group
        if: failure() && steps.full-suite.outcome == 'failure' && github.event_name == 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-log-full-test-suite-4
          path: test-results/full-test-suite.log
          retention-days: 7
          if-no-files-found: error

  typecheck-budget:
    name: Typecheck cost budget
    needs: ci-plan
    if: needs.ci-plan.outputs.typecheck_budget_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Guard deterministic compiler workload
        run: |
          bun scripts/typecheck-budget.ts --self-test
          bun run typecheck:budget

  container-contract:
    name: Container contract and survival census
    needs: ci-plan
    if: needs.ci-plan.outputs.container_contract_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # Both ratchets synthesise a package per schema pair and save it, so they
      # read the committed schema graph and the committed WebAssembly under
      # `packages/*/src/generated`. Neither reads a built `dist`, so this job
      # needs no build step. The declared-child lists and both halves of the
      # reserved-value contract are checked in `lint` above and are not repeated
      # here.
      - name: Contract decisions match what folio does
        # Also recomputes the derived counts in docs/container-contract.md.
        run: bun run check:container-contract

      # `--concurrency 2` is the default; it is stated because every pair writes
      # and re-reads two packages, and a runner that raised it would measure a
      # loaded machine rather than the pair.
      - name: Recorded losses only shrink
        run: bun scripts/container-survival-census.ts run --check --concurrency 2

  docx-kernel:
    name: DOCX kernel (Rust and WebAssembly)
    needs: ci-plan
    if: needs.ci-plan.outputs.docx_kernel_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    env:
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install pinned Rust toolchain and WebAssembly target
        run: rustup show active-toolchain && rustup target add wasm32-unknown-unknown

      - name: Install pinned Hawk
        shell: bash
        run: |
          set -euo pipefail
          expected_hawk_script="cargo +${HAWK_RUST_TOOLCHAIN} hawk check --target-dir target/hawk -D warnings -A hawk::dead_public -A hawk::unnecessary_public"
          jq -e --arg expected "$expected_hawk_script" \
            '.scripts["rust:hawk"] == $expected' package.json >/dev/null
          archive="$RUNNER_TEMP/cargo-hawk.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-hawk"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            -o "$archive" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"
          rustup toolchain install "$HAWK_RUST_TOOLCHAIN" --profile minimal

      - name: Install matching wasm-bindgen CLI
        run: |
          mapfile -t versions < <(cargo metadata --locked --format-version 1 --features wasm | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | .[]')
          if (( ${#versions[@]} != 1 )); then
            echo "expected exactly one wasm-bindgen version, found: ${versions[*]:-none}" >&2
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "${versions[0]}" --locked

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: |
          cargo test -p stella-docx-kernel
          cargo test -p stella-text-shaper

      - name: Rust lint
        run: |
          cargo clippy -p stella-docx-kernel --all-targets -- -D warnings
          cargo clippy -p stella-docx-kernel --lib --features wasm --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p stella-text-shaper --all-targets -- -D warnings
          cargo clippy -p stella-text-shaper --lib --features wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Hawk visibility lint
        run: bun run rust:hawk

      - name: Registry package
        run: cargo package -p stella-docx-kernel --locked

      - name: npm and Cargo version parity
        run: bun run check:docx-kernel-version

      - name: Generate canonical single-thread WebAssembly and enforce size budgets
        run: |
          bun --filter '@stll/docx-core' wasm:generate
          bun --filter '@stll/folio-core' wasm:generate

      - name: Verify canonical WebAssembly artifacts are committed
        run: |
          drift="$(git status --porcelain=v1 --untracked-files=all -- packages/docx-core/src/generated packages/core/src/generated)"
          if [[ -n "${drift}" ]]; then
            echo "canonical WebAssembly artifacts are stale or untracked:" >&2
            echo "${drift}" >&2
            exit 1
          fi

      - name: Upload canonical WebAssembly artifacts after a drift failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-wasm
          path: |
            packages/docx-core/src/generated/
            packages/core/src/generated/
          retention-days: 1
          if-no-files-found: error

  interactions:
    name: Interaction e2e (playground)
    needs: ci-plan
    if: needs.ci-plan.outputs.interactions_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      # Behaviour specs only (assert document content + editor state). The
      # screenshot baselines (rendering.spec) and perf budgets
      # (editing-performance.spec) are env-specific, so they are not run here;
      # the `interactions` Playwright project starts the playground dev server
      # via the config's webServer.
      - name: Run interaction specs
        run: bun run test:interactions

      # Safe to gate on, unlike the screenshot baselines above: this compares
      # the measurer's width against the painted width, both read from the same
      # browser in one layout pass, so cross-machine font rendering cancels out.
      - name: Run measure/paint parity specs
        run: bun run test:measure-parity

      # Every scroll and navigation ref method must move the real scroll
      # container, in React and Vue alike.
      - name: Scroll navigation parity
        run: bunx playwright test --project=parity tests/parity/scroll-root.spec.ts --workers=1

      # The editor bundle a VS Code webview loads, built and driven under the
      # webview's Content Security Policy against a fake extension.
      - name: Run editor-web webview check
        run: bun --filter @stll/folio-editor-web test:e2e

  differential:
    name: Differential parser parity (folio vs python-docx + Open XML SDK)
    needs: ci-plan
    if: needs.ci-plan.outputs.differential_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - run: bun install --frozen-lockfile

      - name: Install python-docx (differential reference parser)
        run: python3 -m pip install --break-system-packages python-docx

      - name: Build Open XML SDK differential projector
        run: dotnet build packages/core/scripts/differential/dotnet -c Release

      # The generated round trip also runs in the test job, where there is no
      # .NET validator; here its redlines are schema-checked as well.
      - name: Validate generated compare fixtures and redlines
        run: bun test benchmarks/compare/documents.test.ts benchmarks/compare/generated-roundtrip.test.ts

      # DIFFERENTIAL_REQUIRED turns a missing reference into a failure rather
      # than a skip, so the full-corpus parity gate cannot silently pass.
      - name: Differential parity (full corpus)
        run: bun run test:differential
        env:
          DIFFERENTIAL_REQUIRED: "1"

  consumer-scenarios:
    name: Consumer scenarios (tarballs)
    needs: ci-plan
    if: needs.ci-plan.outputs.consumer_scenarios_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      # The scenarios run under Node, as an integrator runs the packages; 22 is
      # the oldest Node the CLI supports.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Builds and packs docx-core, core, agents and cli, installs the tarballs
      # into a project outside the workspace, typechecks the scenarios against
      # the published declarations, and runs them against public entry points
      # only: synthetic documents, act, save, reopen, compare every reader.
      # Generated runs belong to nightly and continuous fuzz; pinned seeds,
      # corpus flows and known-issue regressions block PRs and merge groups.
      - name: Scenarios over packed tarballs
        id: scenarios
        env:
          FOLIO_SCENARIO_FUZZ_RUNS: "0"
          FOLIO_SCENARIO_COLLISION_RUNS: "0"
        run: |
          set -o pipefail
          mkdir -p test-results
          bun scripts/consumer-scenarios.ts --typecheck 2>&1 | tee test-results/consumer-scenarios.log

      # Replayed on the group's base when a merge group fails
      # (fuzz-ejection-replay.yml).
      - name: Keep the scenario log of a merge group
        if: always() && steps.scenarios.outcome != 'skipped' && github.event_name == 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-log-consumer-scenarios
          path: test-results/consumer-scenarios.log
          retention-days: 7
          if-no-files-found: ignore

      # Which operation types met which stories, modes, target features and
      # sessions; the run fails on a required cell with no hits.
      - name: Upload the coverage ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-scenarios-coverage
          path: |
            test-results/consumer-scenarios-coverage.json
            test-results/consumer-scenarios-features.json
          retention-days: 14
          if-no-files-found: warn

  packaged-consumer:
    name: Packaged-consumer build (tarballs)
    needs: ci-plan
    if: needs.ci-plan.outputs.packaged_consumer_required == 'true' && needs.ci-plan.outputs.suite_depth == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # Builds + packs both packages, installs the tarballs into a clean-room
      # consumer OUTSIDE the workspace, and runs a production `vite build`. The
      # playground e2e consumes SOURCE and so cannot catch a packaging
      # regression (e.g. a worker `new URL(..., import.meta.url)` target the
      # dist never emits); this build consumes the published TARBALLS.
      - name: Production Vite build over packed tarballs
        run: bun run test:packaged-consumer

      - name: Install Playwright Chromium
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          bunx playwright install --with-deps chromium

      # Runtime half of the same gate: serve the built consumer and drive it in a
      # browser. Catches failures the build cannot see — a worker that resolves at
      # build time but fails to spawn/execute, and UI strings missing from the
      # shipped runtime catalog (IntlError: MISSING_MESSAGE).
      - name: Runtime smoke over packed tarballs
        run: bun run test:packaged-consumer-smoke

  # The ruleset requires this single check. It evaluates every planned job,
  # including jobs GitHub skipped or cancelled before their first step.
  ci-result:
    name: ci-result
    if: always()
    needs:
      - ci-plan
      - changeset
      - property-areas
      - docs-format
      - lint
      - typecheck
      - build-api
      - validate-dist
      - tests-1
      - tests-2
      - tests-3
      - tests-4
      - typecheck-budget
      - container-contract
      - docx-kernel
      - interactions
      - differential
      - consumer-scenarios
      - packaged-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Evaluate CI outcome
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ toJSON(needs.ci-plan.outputs) }}
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          JOB_SCOPES: >-
            {"changeset":{"event":"pull_request"},
            "property-areas":{"event":"pull_request","area":"code_required"},
            "docs-format":{"area":"code_required","value":"false"},
            "lint":{"area":"code_required"},
            "typecheck":{"area":"code_required"},
            "build-api":{"area":"code_required","depth":"full"},
            "validate-dist":{"area":"code_required","depth":"full"},
            "tests-1":{"area":"code_required"},
            "tests-2":{"area":"code_required"},
            "tests-3":{"area":"code_required"},
            "tests-4":{"area":"code_required"},
            "typecheck-budget":{"area":"typecheck_budget_required","depth":"full"},
            "container-contract":{"area":"container_contract_required","depth":"full"},
            "docx-kernel":{"area":"docx_kernel_required","depth":"full"},
            "interactions":{"area":"interactions_required","depth":"full"},
            "differential":{"area":"differential_required","depth":"full"},
            "consumer-scenarios":{"area":"consumer_scenarios_required","depth":"full"},
            "packaged-consumer":{"area":"packaged_consumer_required","depth":"full"}}
        run: |
          if [[ "$PLAN_RESULT" == "skipped" ]]; then
            if [[ "$EVENT" != "pull_request" ]]; then
              echo "::error::CI plan skipped outside a pull request."
              exit 1
            fi
            # Read the current state: a push can race with ready_for_review.
            draft=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .draft)
            if [[ "$draft" != "true" ]]; then
              echo "::error::CI plan skipped but the pull request is ready."
              exit 1
            fi
            exit 0
          fi
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI plan did not succeed ($PLAN_RESULT)."
            exit 1
          fi
          depth=$(jq -r .suite_depth <<< "$PLAN")
          trusted=$(jq -r .trusted <<< "$PLAN")
          expected_depth=fast
          if [[ "$EVENT" == "merge_group" ]]; then
            expected_depth=full
          fi
          if [[ "$trusted" != "true" || "$depth" != "$expected_depth" ]]; then
            echo "::error::CI plan is untrusted or selects the wrong suite depth for $EVENT."
            exit 1
          fi
          violations=$(jq -r --arg event "$EVENT" --arg depth "$depth" --argjson plan "$PLAN" --argjson scopes "$JOB_SCOPES" '
            . as $needs | [$scopes | to_entries[] | .key as $job | .value as $scope
              | $needs[$job].result as $result
              | (($scope.event == null or $scope.event == $event) and
                 ($scope.area == null or
                  ($plan[$scope.area] == ($scope.value // "true") and
                   ($scope.depth == null or $scope.depth == $depth)))) as $selected
              | if $selected and $result != "success" then "\($job) (selected, \($result // "missing"))"
                elif ($selected | not) and $result != "success" and $result != "skipped" then
                  "\($job) (unexpected \($result // "missing"))"
                else empty end] | join(", ")' <<< "$NEEDS")
          if [[ -n "$violations" ]]; then
            echo "::error::CI checks did not succeed: $violations"
            exit 1
          fi
          echo "CI checks succeeded."
