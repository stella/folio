name: CI

env:
  TOOLCHAIN_BASE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || (github.event_name == 'push' && github.event.before) || 'unavailable-toolchain-base' }}
  HAWK_RUST_TOOLCHAIN: "1.97.1"
  HAWK_VERSION: "0.1.11"
  HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256: "8380db63360ae94f9890d7e426cce00e479d884f516614cea998c85d5f30ab6d"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue checks main plus the queued pull requests before merging,
  # so every job the queue may require also runs here, at full depth.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present for published package src changes
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to compute the merge base with main
          persist-credentials: false

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@37bfa04a893d1ae2b9d28379cf68e8360781c8bc # v1.8.0
        with:
          release-paths: |
            crates/docx-kernel/Cargo.toml
            crates/docx-kernel/src/**
            crates/text-shaper/Cargo.toml
            crates/text-shaper/src/**
            packages/utf8-boundaries/src/**
            packages/docx-core/src/**
            packages/core/src/**
            packages/react/src/**
            packages/agents/src/**
            packages/cli/src/**
            packages/vue/src/**
            packages/nuxt/src/**
          generated-paths: |
            Cargo.lock
            Cargo.toml
            bun.lock
            packages/docx-core/src/generated/**
            packages/core/src/generated/**
            packages/utf8-boundaries/CHANGELOG.md
            packages/utf8-boundaries/package.json
            packages/docx-core/CHANGELOG.md
            packages/docx-core/package.json
            packages/core/CHANGELOG.md
            packages/core/package.json
            packages/react/CHANGELOG.md
            packages/react/package.json
            packages/agents/CHANGELOG.md
            packages/agents/package.json
            packages/cli/CHANGELOG.md
            packages/cli/package.json
            packages/vue/CHANGELOG.md
            packages/vue/package.json
            packages/nuxt/CHANGELOG.md
            packages/nuxt/package.json
            plugins/claude-code/.claude-plugin/plugin.json
            plugins/claude-code/.mcp.json
            plugins/herdr/bin/folio-command.sh
            plugins/herdr/herdr-plugin.toml
            plugins/vscode/package.json
          package-files: |
            packages/utf8-boundaries/package.json
            packages/docx-core/package.json
            packages/core/package.json
            packages/react/package.json
            packages/agents/package.json
            packages/cli/package.json
            packages/vue/package.json
            packages/nuxt/package.json
          version-file: bun.lock

  # One scheduling wave decides what the run checks; every other job waits on
  # it and skips when its area is not selected. The planner is the shared
  # stella/.github ci-plan action; `.github/ci-plan.json` holds folio's areas.
  # Pull requests plan by changed path. Merge groups select every area.
  # Toolchain changes select every area at full depth; unchanged pull requests
  # retain path scopes. API preflight derives publication paths from manifests.
  # Drafts plan nothing until marked ready for review.
  ci-plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The shared planner reads PR metadata and checks merge-group trust.
      pull-requests: read
      actions: read
    outputs:
      reused_run: ${{ steps.reuse.outputs.reused_run }}
      warm_caches: ${{ steps.warm.outputs.changed }}
      toolchain_changed: ${{ steps.toolchain.outputs.changed }}
      suite_depth: ${{ (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true') && 'full' || 'fast' }}
      trusted: ${{ steps.plan.outputs.trusted }}
      browser_discovery_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || fromJSON(steps.plan.outputs.areas).browser_discovery) }}
      api_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || steps.api-plan.outputs.api_required == 'true') }}
      code_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || fromJSON(steps.plan.outputs.areas).code) }}
      container_contract_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || fromJSON(steps.plan.outputs.areas).container_contract) }}
      docx_kernel_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || fromJSON(steps.plan.outputs.areas).docx_kernel) }}
      interactions_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || fromJSON(steps.plan.outputs.areas).interactions) }}
      differential_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || fromJSON(steps.plan.outputs.areas).differential) }}
      packaged_consumer_required: ${{ steps.reuse.outputs.reused_run == '' && (github.event_name == 'merge_group' || steps.toolchain.outputs.changed == 'true' || steps.api-plan.outputs.packaged_consumer_required == 'true' || fromJSON(steps.plan.outputs.areas).packaged_consumer) }}
    steps:
      - name: Find successful merge-group coverage
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          workflow_path="${GITHUB_WORKFLOW_REF%%@*}"
          workflow_file="${workflow_path##*/}"
          if ! runs=$(gh api --method GET "repos/$REPO/actions/workflows/$workflow_file/runs" \
              -f event=merge_group -f status=success -f head_sha="$PUSHED_SHA" -f per_page=100); then
            echo "::warning::Could not verify merge-group coverage; running CI."
            exit 0
          fi
          if ! reused_run=$(jq -er --arg sha "$PUSHED_SHA" '
            [.workflow_runs[] | select(.event == "merge_group" and .status == "completed" and
              .conclusion == "success" and .head_sha == $sha and
              (.id | type) == "number" and .id > 0 and (.id | floor) == .id)]
            | first | .id // empty
          ' <<< "$runs"); then
            echo "No verified merge-group coverage; running CI."
            exit 0
          fi
          printf 'reused_run=%s\n' "$reused_run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun scripts/ci-scoped-install.ts ci-plan
      - name: Detect shared toolchain changes
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          changes=$(bunx --no-install stll-toolchain-changed --since "$TOOLCHAIN_BASE")
          printf '%s\n' "$changes"
          # Unreadable is safe (every job runs) but costs the whole fast path, so say so loudly.
          if [[ "$(jq -r '.status' <<< "$changes")" == "unreadable" ]]; then
            echo "::error title=Toolchain change detection unreadable::$(jq -r '.error // "no reason given"' <<< "$changes"); every job runs."
          fi
          changed=$(jq -er '
            if .status == "unreadable" then "true"
            elif .status == "compared" and (.changed | type) == "boolean" then (.changed | tostring)
            else error("Invalid toolchain change result") end
          ' <<< "$changes")
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
      - name: Select cache warming for the pushed range
        id: warm
        if: github.event_name == 'push' && steps.reuse.outputs.reused_run != ''
        env:
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          TOOLCHAIN_CHANGED: ${{ steps.toolchain.outputs.changed }}
        run: |
          set -euo pipefail
          changed=false
          if [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            echo "::warning::Push has no base commit; warming dependency caches."
            changed=true
          elif ! locks=$(git diff --name-only "$PUSH_BASE" "$PUSH_HEAD" -- bun.lock Cargo.lock); then
            echo "::warning::Could not compare the pushed range; warming dependency caches."
            changed=true
          elif [[ -n "$locks" || "$TOOLCHAIN_CHANGED" == "true" ]]; then
            changed=true
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
      - name: Select published API preflight
        id: api-plan
        if: github.event_name == 'pull_request'
        run: bun scripts/ci-api-plan.ts --base "$API_BASE" --head "$API_HEAD"
        env:
          API_BASE: ${{ github.event.pull_request.base.sha }}
          API_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Plan changed-path scopes
        id: plan
        uses: stella/.github/.github/actions/ci-plan@37bfa04a893d1ae2b9d28379cf68e8360781c8bc # v1.8.0
        with:
          policy-file: .github/ci-plan.json

  warm-main-caches:
    name: Warm main dependency caches
    needs: ci-plan
    if: github.event_name == 'push' && needs.ci-plan.outputs.reused_run != '' && needs.ci-plan.outputs.warm_caches == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - &source-lint-cache
        name: Cache shared Rust source lint
        id: source-lint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-stella-lint
          key: ${{ runner.os }}-${{ runner.arch }}-stella-source-lint-a1bd81740ecb4b66999f56d1716e1190c4e7272f

      - &source-lint-install
        name: Install shared Rust source lint
        if: steps.source-lint-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/stella/tooling --rev a1bd81740ecb4b66999f56d1716e1190c4e7272f --locked stella_source_lint

  browser-discovery:
    name: Browser test discovery
    needs: ci-plan
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && needs.ci-plan.outputs.browser_discovery_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun scripts/ci-scoped-install.ts browser-discovery
      - name: Discover every Node Playwright project without browsers
        run: bun scripts/ci-browser-discovery.ts

  # bun fmt formats Markdown too, so a documentation-only change still has its
  # formatting checked; any other change runs the full format check in `lint`.
  docs-format:
    name: Format check (documentation only)
    needs: ci-plan
    if: needs.ci-plan.outputs.reused_run == '' && needs.ci-plan.outputs.code_required == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Format check
        run: bun fmt --check

  lint:
    name: Lint and source guards
    needs: ci-plan
    if: needs.ci-plan.outputs.reused_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # `--frozen-lockfile` above only checks that the dependency graph still
      # satisfies bun.lock; it does not notice a workspace's cached "version"
      # field drifting behind its package.json (a plain `bun install` doesn't
      # rewrite that field either. The release path uses the same script in
      # byte-preserving --write mode; CI keeps it in check-only mode.
      - name: Shared toolchain policy
        run: bun run check:toolchain

      - name: Lockfile workspace-version check
        run: bun run check:lockfile-versions

      - name: Lockfile override-range check
        run: bun run check:lockfile-overrides

      - name: Lockfile deduplication check
        run: bun run check:dedupe

      - name: Quarantine-exclude guard
        # The 5-day release-age quarantine is excluded per package for the
        # first-party @stll/* code folio pulls from npm, and bun matches those
        # entries EXACTLY (a `@stll/*` glob is accepted and ignored). List a
        # napi package without its platform subpackages and the parent installs
        # while its binaries stay quarantined — and a quarantined
        # optionalDependency is skipped SILENTLY, so the package imports fine
        # and throws on first use. This fails when the exclude list stops
        # covering everything in the lock. Temporary third-party exemptions
        # carry an exact expiry so the same check also fails once Bun's
        # release-age gate can take over again. The guard's own self-test runs
        # with `bun run test` below.
        run: bun run check:quarantine-excludes

      - name: Normalisation warning coverage
        # Folio's tolerance rule is that input Word accepts is normalised
        # rather than refused, with a structured warning. A normaliser that
        # reports nothing changes the document in silence, and nothing about
        # writing one makes the author reach for the warning channel. This
        # fails when a normalisation module neither names a warning code nor
        # states why it loses nothing.
        run: bun run check:normalization-warnings

      - name: Dependency audit
        run: bun run audit

      - name: Canonical session capability ledger
        run: bun run check:canonical-cutover

      - name: Static source guards
        run: bun run test:source-guards

      - name: Lint
        run: bun run lint

      - name: Workspace dependency boundaries
        run: bun run check:dependencies

      - name: Published package dependency declarations
        run: bun scripts/check-package-dependencies.ts --source

      - name: Format check
        run: bun fmt --check

      - name: i18n check
        run: bun run check:i18n

      # Only the `shaping` profile: fetching every source would pull a 43 MB
      # specification archive and a git clone for two small UCD text files.
      - name: Fetch Unicode shaping sources
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run specifications:fetch --profile shaping

      - name: Unicode joining tables up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:joining-types:check

      - name: Strict value encodings up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:strict-value-encodings:check

      # The names ECMA-376 Part 1 spells by writing direction, derived from the
      # cited rename list and the committed graph.
      - name: Strict names up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:strict-names:check

      # The tolerance stays in the one reader that consults the table, so a
      # parser cannot grow a second, unmeasured copy of the same equivalence.
      - name: No reader hand-lists a Strict spelling
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:strict-name-tolerance

      # The theme-colour vocabularies. Two enumerations spell one colour
      # differently, so a hand-written union drifts silently and the token it
      # omits is dropped at parse time.
      - name: Theme colour enumerations up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:theme-colors:check

      # The model enumerations that stand for an OOXML simple type. A member
      # the format declares and the union omits is dropped at parse time and
      # never reaches the writer, so the lists are generated rather than kept
      # by hand.
      - name: OOXML enumerations up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:ooxml-enumerations:check

      # The dispatched containers' declared-child lists, which make each
      # handler map total: a schema refresh that adds a child fails here
      # rather than letting the child be dropped without a decision.
      - name: Container child lists up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:container-children:check

      # `ST_Border`, which `BorderSpec.style` is typed with. A schema refresh
      # that adds a member fails here rather than widening the union silently,
      # and the CSS rendering table is total over it at compile time.
      - name: Border styles up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:border-styles:check

      # `ST_PresetLineDashVal`, which `ShapeOutline.dash` is typed with. Each
      # painter's dash table is total over it at compile time, so a schema
      # refresh that adds a member fails here rather than leaving one table
      # short of the vocabulary it resolves.
      - name: Preset line dashes up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:preset-line-dash:check

      # Both halves of the reserved-value contract. The registry is total over
      # the model at compile time; these cover the schema side (no slot that can
      # carry a reserved value is undecided) and the reader side (no new bare
      # comparison against a sentinel).
      - name: Reserved values covered over the schema graph
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:reserved-value-coverage

      - name: Bare reserved-value comparisons only shrink
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:reserved-values

      # The corpus gate itself is nightly: it downloads a hundred megabytes and
      # takes the better part of an hour, so no pull request can ratchet the
      # recorded numbers. This asks the cheap question instead, over committed
      # files alone: whether the baselines, the refusal list and the report-only
      # list are internally consistent and still describe the committed lock.
      # A corpus-only change would otherwise reach main with nothing that reads
      # what it changed.
      - name: Corpus baselines are internally consistent
        run: bun run check:corpus-baselines

      # Both halves of the identity-attribute contract. The set is derived from
      # the schema graph and the extension vocabularies; these cover the
      # derivation (it still matches the graph) and the reader side (no new
      # attribute identity resolved through a prefix).
      - name: Identity attributes up to date
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run generate:identity-attributes:check

      - name: Fuzz attribute schema facts up to date
        run: bun scripts/generate-fuzz-schema.ts check

      - name: Prefix-resolved identity reads only shrink
        if: needs.ci-plan.outputs.suite_depth == 'full'
        run: bun run check:identity-attributes

      - name: Adapter parity contract (React <-> Vue props/ref)
        run: bun run check:parity-contract

      - name: Adapter export parity (React <-> Vue public exports)
        run: bun run check:export-parity

      - name: React Compiler bailout guard
        # The compiler skips some imperative ProseMirror/ref-heavy components.
        # Guard their manual memoization so a cleanup cannot create render loops.
        run: bun run check:react-compiler

  typecheck:
    name: Typecheck
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun scripts/ci-plan.ts --base "$TYPECHECK_BASE" --head "$GITHUB_SHA"
        env:
          TYPECHECK_BASE: ${{ (github.event_name == 'workflow_dispatch' && '0000000000000000000000000000000000000000') || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          TYPECHECK_PUSH: ${{ github.event_name == 'push' }}

  build-api:
    name: Build reproducibility and API reports
    needs: ci-plan
    if: needs.ci-plan.outputs.api_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # compare generated declarations with the base commit
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Reproducible package builds (all published packages)
        run: bun run check:build-reproducibility

      - name: API surface report
        id: api-surface-report
        env:
          API_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          # A pull request builds its merge with the current base, and the
          # event's base SHA can trail that base, so compare with the merge's
          # first parent: growth already on the base is not this change's.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            API_BASE="$(git rev-parse HEAD^1)"
            export API_BASE
          fi
          bun scripts/api-surface-budget.ts --self-test
          bun run api:check
          bun run api:budget

      # The failure prints a diff, but the regenerated tree is what a reader
      # copies over `api-reports/` when the runner and their machine disagree.
      - name: Upload regenerated API reports after a surface failure
        if: failure() && steps.api-surface-report.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reports-regenerated
          path: |
            .cache/api-reports/
            packages/utf8-boundaries/dist/**/*.d.ts
          retention-days: 1
          if-no-files-found: error

  tests-1:
    name: Focused and full tests (1/4)
    needs: ci-plan
    if: needs.ci-plan.outputs.code_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A generated property case found by the commit's seed reports here
      # instead of failing; pinned seeds, examples and every other test still
      # fail (test/property-exploration.ts).
      FOLIO_FUZZ_EXPLORATION: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'report' || 'fail' }}
      FOLIO_FUZZ_EXPLORATION_DIR: ${{ github.workspace }}/test-results/fuzz-exploration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fast-depth selection diffs the PR merge base
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - name: Focused unit tests
