name: Nightly Consumer Fuzz

on:
  schedule:
    # 05:17 UTC daily, offset from the top of the hour to avoid the scheduler's
    # peak-minute contention.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  consumer-fuzz:
    name: Generated consumer scenarios (nightly budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@042baebaf071329b956555c05caf5736504c278d
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Fresh seeds each night; reruns retain the same seed. Pinned regressions
      # run alongside a larger generated budget than the default 12/8 runs.
      - name: Sweep the batch properties
        run: |
          mkdir -p test-results
          cd packages/core
          for seed in 11 33; do
            PROPERTY_TEST_NUM_RUNS_FACTOR=300 PROPERTY_TEST_SEED=$seed bun test ./src/ai-edits/batchOverlap.test.ts -t 'refuses each conflict and applies the rest as one at a time would' --timeout 3000000 2>&1 | tail -40
          done
          PROPERTY_TEST_NUM_RUNS_FACTOR=30 PROPERTY_TEST_SEED=66 bun test ./src/ai-edits/batchOverlap.test.ts -t 'applies accepted patches in planner order' --timeout 3000000 2>&1 | tail -40

      - name: Keep the consumer fuzz log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-consumer-fuzz
          path: test-results/nightly-consumer-fuzz.log
          retention-days: 14
          if-no-files-found: ignore

  # Separate so the fuzz jobs never hold a write token. Main only: a dispatch
  # on a branch reports in its run, not in the issue tracker.
  report-consumer-fuzz:
    name: File failures by signature
    needs: consumer-fuzz
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: nightly-consumer-fuzz
      lane: nightly-consumer-fuzz
      result: ${{ needs.consumer-fuzz.result }}
