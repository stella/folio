name: Nightly Consumer Fuzz

on:
  schedule:
    # 05:17 UTC daily, offset from the top of the hour to avoid the scheduler's
    # peak-minute contention.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  consumer-fuzz:
    name: Generated consumer scenarios (nightly budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Fresh seeds each night; reruns retain the same seed. Pinned regressions
      # run alongside a larger generated budget than the default 12/8 runs.
      - name: L3 at-once replay on main
        run: |
          mkdir -p test-results
          cd packages/docx-core && PROPERTY_TEST_SEED=2133206926 PROPERTY_TEST_PATH='88:3:6:14:14:15:15:15:15:15:17:18:22:24:29:29:29:29:29:30:30:30:30:30:30:30:30:30:30:30:30:30:30:30:30:30:30:32:33:31:49:39:41:40:8:27:0:1:4:10:23:18:18:18:18:20:18:20:18:18:20:18:29:20:3:18:17:18:17:17:17:18:18:17:17:19:17:17:19:19:19:19:19:19:19:19:19:19:19:19:19:19:19:19:19:19:19:22:37:28:21:21:24:25:33:24:52:42:40:56:17:17:17:55:56:56:58:53:54:58:54:54:54:54:54:54:54:54:54:55:55:55:55:55:55:55:55:55:77:56:61:61:61:62:26:24:24:26:26:29:24:24:24:26:24:24:35:22:21:21:21:21:21:21:21:21:21:31:27:29:27:19:33:24:24:28:28:28:28:28:28:28:28:28:28:28:28:28:28:28:28:28:28:28:30:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29:29' bun test ./src/ops/__tests__/review.property.test.ts -t 'L3: resolving a run'\''s revisions at once equals resolving each operation'\''s in turn' 2>&1 | tee ../../test-results/nightly-consumer-fuzz.log | grep -E '\(pass\)|\(fail\)|error:' | cut -c1-3000

      - name: Keep the consumer fuzz log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-consumer-fuzz
          path: test-results/nightly-consumer-fuzz.log
          retention-days: 14
          if-no-files-found: ignore

  # Separate so the fuzz jobs never hold a write token. Main only: a dispatch
  # on a branch reports in its run, not in the issue tracker.
  report-consumer-fuzz:
    name: File failures by signature
    needs: consumer-fuzz
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: nightly-consumer-fuzz
      lane: nightly-consumer-fuzz
      result: ${{ needs.consumer-fuzz.result }}
