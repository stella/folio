name: Nightly Consumer Fuzz

on:
  schedule:
    # 05:17 UTC daily, offset from the top of the hour to avoid the scheduler's
    # peak-minute contention.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  consumer-fuzz:
    name: Generated consumer scenarios (nightly budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@5764ab66e4df84cfd2e642c7d7e4678261e668f8
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Fresh seeds each night; reruns retain the same seed. Pinned regressions
      # run alongside a larger generated budget than the default 12/8 runs.
      - name: Generated random and collision flows
        run: |
          set -o pipefail
          mkdir -p test-results
          export FOLIO_SCENARIO_SEED=$(( (GITHUB_RUN_ID * 7919) % 2147483647 ))
          bun scripts/consumer-scenarios.ts -- fuzz.test.ts 2>&1 \
            | tee test-results/nightly-consumer-fuzz.log
        env:
          FOLIO_SCENARIO_FUZZ_RUNS: "240"
          FOLIO_SCENARIO_COLLISION_RUNS: "160"
          FOLIO_SCENARIO_FUZZ_STEPS: "16"

      - name: Keep the consumer fuzz log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-consumer-fuzz
          path: test-results/nightly-consumer-fuzz.log
          retention-days: 14
          if-no-files-found: ignore

  # Separate so the fuzz jobs never hold a write token. Main only: a dispatch
  # on a branch reports in its run, not in the issue tracker.
  report-consumer-fuzz:
    name: File failures by signature
    needs: consumer-fuzz
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: nightly-consumer-fuzz
      lane: nightly-consumer-fuzz
      result: ${{ needs.consumer-fuzz.result }}
