name: Nightly Property Tests

on:
  schedule:
    # 05:17 UTC daily, offset from the top of the hour to avoid the scheduler's
    # peak-minute contention.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      factor:
        description: "numRuns multiplier (overrides the default nightly factor)"
        required: false
        default: "10"

permissions: {}

jobs:
  property-test:
    name: Property tests (nightly budget)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # persist-credentials: false — this job can be manually dispatched on any
      # branch ref, so the checkout token must not linger in the git config for
      # branch-controlled steps to reuse.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # Run only the property tests, in isolation, with a larger per-test budget
      # than PR CI affords. `test:property` (scripts/property-areas.ts --all)
      # runs every test file that drives a property, in every package.
      # `propertyConfig` from test/property-testing.ts reads
      # PROPERTY_TEST_NUM_RUNS_FACTOR to scale every property's numRuns, and
      # seeds each property from the commit and PROPERTY_TEST_SEED_SALT (the run
      # id, so an unchanged main still searches new seeds each night while a
      # rerun of this run replays it). A failure logs its replay line and a
      # PROPERTY_FAILURE line the report job below turns into an issue.
      - name: Property test suite
        run: |
          set -o pipefail
          bun run test:property 2>&1 | tee property-test.log
        env:
          FOLIO_DOCUMENT_OPS_RANDOM: "1"
          PROPERTY_TEST_NUM_RUNS_FACTOR: ${{ github.event.inputs.factor || '10' }}
          PROPERTY_TEST_SEED_SALT: ${{ github.run_id }}

      # Open findings stay outside the fixed regression registry, and replay
      # independently so a failure cannot prevent the fresh suite from running.
      - name: Replay open Document differential finding (#1343)
        if: always()
        working-directory: packages/core
        run: |
          set -o pipefail
          bun test src/__tests__/documentOpsDifferential.property.test.ts -t 'PM and Document ops agree after every generated text and formatting step' 2>&1 | tee -a ../../property-test.log
        env:
          FOLIO_DOCUMENT_OPS_RANDOM: "1"
          PROPERTY_TEST_NUM_RUNS_FACTOR: "1"
          PROPERTY_TEST_SEED: "961221164"
          PROPERTY_TEST_PATH: "1:4:2:4:4:4:5:7:7:0:1:3:3:3:5:4:4:7:7:7:7:7:7:4:3:3:3:3:3"

      - name: Keep the log for the failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: property-test-log
          path: property-test.log
          retention-days: 14
          if-no-files-found: ignore

  conformance-full:
    name: Editor-command conformance (full tier)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile

      # PR CI drives each operation at its curated placements; the full tier
      # drives every operation at every selection placement. Known gaps scoped
      # to the full tier only reproduce here, so this run is also what fails
      # when one of them is fixed and its entry has to go.
      - name: Every operation at every placement
        working-directory: packages/core
        env:
          FOLIO_CONFORMANCE_FEATURE_COVERAGE_OUT: ../../test-results/conformance-features.json
        run: |
          set -o pipefail
          bun run test:conformance:full 2>&1 | tee ../../conformance-full.log

      - name: Keep feature coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-feature-coverage
          path: test-results/conformance-features.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the log for the failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-full-log
          path: conformance-full.log
          retention-days: 14
          if-no-files-found: ignore

  # Property failures keep per-test issues and replay seeds. Conformance
  # failures update one standing issue with the latest run and replay evidence.
  # Separate jobs so the test runs never hold a write token. Main only: a
  # dispatch on a branch reports in its run, not in the issue tracker.
  report-property:
    name: Report property failures
    needs: property-test
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: nightly-property-failure-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: property-test-log

      - name: Open or update the failure issues
        run: >-
          bun scripts/nightly-failure-issues.ts --kind property --log property-test.log
          --run-url "${RUN_URL}" --sha "${GITHUB_SHA}" --factor "${FACTOR}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FACTOR: ${{ github.event.inputs.factor || '10' }}

  report-conformance:
    name: Report conformance failures
    needs: conformance-full
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: nightly-conformance-failure-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: conformance-full-log

      - name: Open or update the failure issues
        run: >-
          bun scripts/nightly-failure-issues.ts --kind conformance --log conformance-full.log
          --run-url "${RUN_URL}" --sha "${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  consumer-fuzz:
    name: Generated consumer scenarios (nightly budget)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Fresh seeds each night; reruns retain the same seed. Pinned regressions
      # run alongside a larger generated budget than the default 12/8 runs.
      - name: Generated random and collision flows
        run: |
          set -o pipefail
          mkdir -p test-results
          export FOLIO_SCENARIO_SEED=$(( (GITHUB_RUN_ID * 7919) % 2147483647 ))
          bun scripts/consumer-scenarios.ts -- fuzz.test.ts 2>&1 \
            | tee test-results/nightly-consumer-fuzz.log
        env:
          FOLIO_SCENARIO_FUZZ_RUNS: "240"
          FOLIO_SCENARIO_COLLISION_RUNS: "160"
          FOLIO_SCENARIO_FUZZ_STEPS: "16"

      - name: Keep the consumer fuzz log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-consumer-fuzz
          path: test-results/nightly-consumer-fuzz.log
          retention-days: 14
          if-no-files-found: ignore

  # Separate so the fuzz jobs never hold a write token. Main only: a dispatch
  # on a branch reports in its run, not in the issue tracker.
  report-consumer-fuzz:
    name: File failures by fingerprint
    needs: consumer-fuzz
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fuzz-failure-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: nightly-consumer-fuzz
          path: fuzz-results

      - name: Open or update one issue per fingerprint
        run: >-
          bun scripts/fuzz-failure-issues.ts
          --log fuzz-results/nightly-consumer-fuzz.log
          --source "nightly consumer fuzz" --run-url "${RUN_URL}" --sha "${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
