name: Nightly property test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Replay review seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stella/.github/actions/setup-bun-cached@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
        with:
          bun-version-file: "package.json"
      - run: bun install --frozen-lockfile
      - name: Review laws and boundary tests
        working-directory: packages/docx-core
        run: bun test ./src/ops/__tests__/review.property.test.ts ./src/ops/__tests__/rejectRangeBoundaries.test.ts ./src/ops/__tests__/rangeBoundarySourceOwnership.test.ts ./src/ops/__tests__/rangeBoundaryResolutionOrder.test.ts ./src/ops/__tests__/resolutionProvenance.property.test.ts ./src/ops/__tests__/cutPieceIdentity.property.test.ts
