name: Nightly Consumer Fuzz

on:
  schedule:
    # 05:17 UTC daily, offset from the top of the hour to avoid the scheduler's
    # peak-minute contention.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  consumer-fuzz:
    name: Generated consumer scenarios (nightly budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: stella/.github/actions/setup-bun-cached@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      - name: Scratch replays
        run: |
          set +e
          mkdir -p test-results /tmp/tb
          echo "SCRATCH_ENGINE_ENV ${FOLIO_SCENARIO_ENGINE:-default}"
          bun scripts/consumer-scenarios.ts --pack-only /tmp/tb > test-results/pack.log 2>&1 || { tail -50 test-results/pack.log; exit 1; }
          bun scripts/consumer-scenarios.ts --tarballs /tmp/tb -- zz-scratch-replays.test.ts > test-results/flows.log 2>&1
          grep -E 'SCRATCH_' test-results/flows.log || tail -80 test-results/flows.log
          while IFS=$'\t' read -r name args; do
            eval "bun scripts/consumer-scenarios.ts --tarballs /tmp/tb $args" > test-results/seed.log 2>&1
            rc=$?
            echo "SCRATCH_SEED $name rc=$rc $(grep -E 'FOLIO_FAILURE|\[batchSequential\]|\[directTracked\]|differs|differ:|  Error:|failed at step|refused' test-results/seed.log | head -6 | cut -c1-700 | tr '\n' ' ')"
            cat test-results/seed.log >> test-results/nightly-consumer-fuzz.log
          done < .github/scratch-seeds.tsv
          cat test-results/flows.log >> test-results/nightly-consumer-fuzz.log
        env:
          FOLIO_SCENARIO_SEED: "1"
          FOLIO_SCENARIO_ENGINE: canonical

      - name: Keep the consumer fuzz log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-consumer-fuzz
          path: test-results/nightly-consumer-fuzz.log
          retention-days: 14
          if-no-files-found: ignore

  # Separate so the fuzz jobs never hold a write token. Main only: a dispatch
  # on a branch reports in its run, not in the issue tracker.
  report-consumer-fuzz:
    name: File failures by signature
    needs: consumer-fuzz
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: nightly-consumer-fuzz
      lane: nightly-consumer-fuzz
      result: ${{ needs.consumer-fuzz.result }}
