name: Nightly Swarm Fuzz

on:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions: {}
concurrency:
  group: nightly-swarm-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: "package.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Generate and shrink swarm flows
        run: |
          set -o pipefail
          mkdir -p test-results
          export FOLIO_SCENARIO_SEED=$(( (GITHUB_RUN_ID * 7919) % 2147483647 ))
          bun scripts/consumer-scenarios.ts -- continuous-fuzz.test.ts 2>&1 | tee test-results/swarm-fuzz.log
        env:
          FOLIO_SCENARIO_SWARM: "1"
          FOLIO_SCENARIO_BUDGET_SECONDS: "1200"
          FOLIO_SCENARIO_FUZZ_STEPS: "20"
          FOLIO_SCENARIO_SHRINK_SECONDS: "240"
          FOLIO_SCENARIO_FAILURES_DIR: test-results/fuzz-failures
          FOLIO_SCENARIO_MINIMIZED_DIR: test-results/fuzz-minimized
      - name: Keep full and minimized traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swarm-fuzz
          path: test-results
          retention-days: 14

  # Separate so the fuzz jobs never hold a write token. Main only: a dispatch
  # on a branch reports in its run, not in the issue tracker.
  report:
    name: File failures by signature
    needs: [swarm]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fuzz-failure-report.yml
    with:
      artifact-pattern: swarm-fuzz
      lane: nightly-swarm-fuzz
      result: ${{ needs.swarm.result }}
