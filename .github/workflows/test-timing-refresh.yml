name: Test Timing Refresh

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: test-timing-refresh
  cancel-in-progress: false

permissions: {}

env:
  TIMING_BRANCH: perf/refresh-test-timings
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  refresh:
    name: Refresh measured test timings
    if: github.repository == 'stella/folio'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: stella/.github/actions/setup-bun-cached@c6d66dfa2a5ad1f96a21b819fe456fecdd3d6f6d
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # The full suite's timings come from five successful full runs; the
      # extended property timings from the last five extended runs on main;
      # job and step durations from each workflow's recent runs.
      - name: Download the recent timing sets
        id: measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refresh() {
            local source="$1" output="$2"
            local manifest="$RUNNER_TEMP/${source}-timing-artifacts.tsv"
            local directory="timing-artifacts/${source}"
            bun scripts/aggregate-ci-test-timings.ts \
              --artifact-manifest "$manifest" \
              --repository "$GITHUB_REPOSITORY" \
              --source "$source"
            if [[ ! -s "$manifest" ]]; then
              echo "No ${source} timing sets are available; keeping ${output}." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            while IFS=$'\t' read -r run_id artifact_id; do
              mkdir -p "${directory}/${run_id}"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/${artifact_id}.zip"
              unzip -q "${RUNNER_TEMP}/${artifact_id}.zip" -d "${directory}/${run_id}"
            done < "$manifest"
            local inputs_file="$RUNNER_TEMP/${source}-timing-inputs.txt"
            find "$directory" -name '*-timings-*.json' -type f | sort > "$inputs_file"
            local inputs
            mapfile -t inputs < "$inputs_file"
            bun scripts/aggregate-ci-test-timings.ts --source "$source" --output "$output" "${inputs[@]}"
          }
          refresh tests scripts/ci-test-timings.json
          refresh properties scripts/property-test-timings.json
          # Job and step durations for the workflow time limit rule
          # (scripts/workflow-timeouts.test.ts).
          bun scripts/workflow-durations.ts \
            --repository "$GITHUB_REPOSITORY" \
            --output scripts/workflow-durations.json
          if git diff --quiet -- scripts/ci-test-timings.json scripts/property-test-timings.json scripts/workflow-durations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Reuse the repository's existing maintenance-app identity.
      - name: Mint app token
        if: steps.measurements.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the timing PR
        if: steps.measurements.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TIMING_BRANCH}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TIMING_BRANCH}" -f sha="$base" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${TIMING_BRANCH}" -f sha="$base" > /dev/null
          fi
          request="$RUNNER_TEMP/test-timing-commit.json"
          bun scripts/aggregate-ci-test-timings.ts \
            --graphql-request "$request" \
            --timings scripts/ci-test-timings.json \
            --property-timings scripts/property-test-timings.json \
            --workflow-durations scripts/workflow-durations.json \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$TIMING_BRANCH" \
            --base "$base"
          gh api graphql --input "$request" > /dev/null
          if [[ -z "$(gh pr list --head "$TIMING_BRANCH" --state open --json number --jq '.[0].number // ""')" ]]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$TIMING_BRANCH" \
              --title "perf(ci): refresh measured test timings" \
              --body "Refreshes per-file test duration medians from recent full-suite and extended property runs so shard scheduling follows current measurements, and the job and step durations that workflow time limits are checked against."
          fi
