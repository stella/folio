[install]
# Bun 1.4 supports isolated workspace installs backed by a shared immutable
# package store across local checkouts and worktrees.
linker = "isolated"
globalStore = true
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
minimumReleaseAge = 432000
# First-party @stll packages folio consumes from public npm. They share a
# release cadence and would otherwise be blocked on every publish cycle.
# folio's own published packages are absent on purpose: they resolve through
# the `workspace:` protocol and never reach the registry.
#
# A napi package must be listed WITH its platform subpackages. They publish in
# the same minute, but they are optionalDependencies: quarantine one and bun
# skips it silently, leaving the parent installed with no native binding and
# every call failing at runtime. Bun matches these names exactly — a `@stll/*`
# glob is accepted and then ignored.
#
# A third-party entry that is only needed until the release-age gate catches up
# carries its own expiry, `"pkg", # quarantine-expires: <ISO UTC instant>`, and
# is removed automatically once that instant passes.
#
# `bun run check:quarantine-excludes` enforces all of the above.
minimumReleaseAgeExcludes = [
  # bun-types ships only declarations and must match the pinned Bun runtime.
  # Keep Bun's compiler contract aligned with the runtime during this upgrade.
  # Security patch for a dependency-audit finding. dompurify 3.4.13 is the only
  # release that fixes GHSA-55q2-fjhq-7xh7; publisher and repository ownership
  # match the preceding releases. Remove after quarantine expiry.
  "bun-types", # quarantine-expires: 2026-10-27T10:17:50.170Z
  # Security fixes: fast-uri 3.1.9 fixes two dependency-audit advisories;
  # happy-dom 21.0.4 and its registrator fix CVE-2026-33943. Remove at expiry.
  "fast-uri", # quarantine-expires: 2026-10-24T23:05:26.357Z
  "happy-dom", # quarantine-expires: 2026-10-25T18:05:53.295Z
  "@happy-dom/global-registrator", # quarantine-expires: 2026-10-25T17:57:23.951Z
  "@stll/agent-input", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/aho-corasick", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/aho-corasick-darwin-arm64", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/aho-corasick-darwin-x64", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/aho-corasick-linux-arm64-gnu", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/aho-corasick-linux-x64-gnu", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/aho-corasick-wasm32-wasi", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/aho-corasick-win32-x64-msvc", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search-darwin-arm64", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search-darwin-x64", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search-linux-arm64-gnu", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search-linux-x64-gnu", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search-wasm32-wasi", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search-win32-x64-msvc", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/conditions", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/country-codes", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/docx-utils", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/regex-set", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/regex-set-darwin-arm64", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/regex-set-darwin-x64", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/regex-set-linux-arm64-gnu", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/regex-set-linux-x64-gnu", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/regex-set-wasm32-wasi", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/regex-set-win32-x64-msvc", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/template-conditions", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/text-normalize", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/time", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
  "@stll/fuzzy-search-wasm", # quarantine-excluded-since: 2026-10-22T15:02:29.496Z
]

[fmt]
printWidth = 80
ignorePatterns = [
  # Shared generated files (stll-toolchain formatter policy).
  ".ai/shared/**",
  ".agents/skills/**",
  ".claude/skills/**",
  "**/AGENTS.md",
  "**/GEMINI.md",
  "**/CLAUDE.md",
  ".github/dependabot.yml",
  "**/fixtures/**",
  "**/__fixtures__/**",
  "**/testdata/**",
  "**/__snapshots__/**",
  "**/*.gen.*",
  "api-reports/**",
  "packages/docx-core/src/generated/**",
  "packages/core/src/generated/**",
  "packages/react/src/i18n/messages/**",
  "packages/vue/src/i18n/messages/**",
]

[fmt.sortImports]
customGroups = [
  { groupName = "react", elementNamePattern = [
    "react",
    "react-dom",
    "react-dom/**",
  ] },
  { groupName = "stella", elementNamePattern = ["@stll/**"] },
  { groupName = "aliases", elementNamePattern = ["@/**"] },
]
groups = [
  "react",
  ["builtin", "external", "type-builtin", "type-external"],
  "stella",
  "aliases",
  ["parent", "sibling", "index", "type-parent", "type-sibling", "type-index"],
]
newlinesBetween = true
