# The extension installs apart from the workspace, so its packaging tools stay
# out of the root lockfile and audit. The policy matches the root bunfig.toml.
[install]
linker = "isolated"
globalStore = true
# 5-day quarantine: reject package versions published less than 5 days ago.
minimumReleaseAge = 432_000

# Registry-backed first-party packages follow the root install policy.
minimumReleaseAgeExcludes = [
  # bun-types ships only declarations and must match the pinned Bun runtime.
  "bun-types", # quarantine-expires: 2026-10-27T10:17:50.170Z
  "fast-uri", # quarantine-expires: 2026-10-24T23:05:26.357Z
  "@stll/fuzzy-search-wasm",
]
