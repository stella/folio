# Opt-in pre-commit hooks.
# To activate: bun run hooks:install
# To deactivate: bun run hooks:uninstall
#
# These hooks are NOT auto-installed. Each developer
# chooses whether to use them.

no_auto_install: true

pre-commit:
  parallel: false
  commands:
    lint:
      # The roots of the lint script, so a commit is held to what CI lints.
      glob:
        - "packages/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
        - "scripts/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
        - "test/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
        - "benchmarks/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
        - "parity/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
        - "specifications/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
      run: bun --bun oxlint -c oxlint.config.ts --threads=2 --no-error-on-unmatched-pattern --fix {staged_files}
      stage_fixed: true
    format:
      run: bun fmt --staged
    i18n:
      glob: "packages/core/src/i18n/messages/*.{json,ts}"
      run: bun run i18n:sync
      stage_fixed: true

# Heavy checks run in CI. Use the repository scripts when you want to run
# lint, typecheck, tests, builds, or full formatting locally before pushing.
